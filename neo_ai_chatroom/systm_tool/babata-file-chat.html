<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巴巴塔 · 聊天 + 本地文件管家</title>
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f3f6fa 0%, #eef0f5 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .chat-card {
      width: 100%;
      max-width: 1400px;
      height: 90vh;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), inset 0 1px 2px rgba(255,255,255,0.6);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.5);
    }
    /* 左侧：文件浏览器（复用文件管理样式的精简版） */
    .file-explorer {
      width: 280px;
      background: rgba(245, 248, 250, 0.5);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      padding: 20px 0 20px 12px;
    }
    .explorer-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px 16px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      margin-bottom: 12px;
    }
    .explorer-header i {
      font-size: 24px;
      color: #1e3b5c;
      background: white;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 4px 10px -6px #1a2e44;
    }
    .explorer-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1f3a5f;
    }
    .tree {
      list-style: none;
      padding-left: 8px;
      overflow-y: auto;
      flex: 1;
      font-size: 0.95rem;
    }
    .tree li {
      list-style: none;
      line-height: 2.2;
      cursor: default;
      user-select: none;
    }
    .tree .folder-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px 4px 4px;
      border-radius: 30px;
      transition: background 0.1s;
      white-space: nowrap;
    }
    .tree .folder-item:hover {
      background: rgba(180, 200, 230, 0.4);
    }
    .tree .folder-item .icon {
      width: 26px;
      text-align: center;
      color: #3e5f7a;
    }
    .tree .folder-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree .folder-item .expand-icon {
      width: 24px;
      text-align: center;
      color: #6f8faf;
      transition: transform 0.15s;
      cursor: pointer;
    }
    .tree ul {
      list-style: none;
      padding-left: 28px;
      margin-left: 8px;
      border-left: 1px dashed rgba(90, 120, 150, 0.2);
      overflow: hidden;
    }
    .tree li.collapsed > ul {
      display: none;
    }
    .explorer-footer {
      padding: 16px 12px 8px 16px;
      font-size: 0.8rem;
      color: #4f658d;
      border-top: 1px solid rgba(0,0,0,0.05);
      background: transparent;
    }
    .explorer-footer i {
      margin-right: 6px;
      color: #3f68a0;
    }
    /* 右侧：巴巴塔聊天室 + 拖拽上传区 */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
    }
    .header {
      padding: 22px 28px;
      background: rgba(255,255,255,0.3);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header i {
      font-size: 28px;
      color: #2d5c8f;
      background: white;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 6px 12px -8px rgba(0,35,70,0.2);
    }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      color: #1a2e44;
    }
    .header span {
      background: #e0e8f0;
      margin-left: auto;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #1f3a5f;
      font-weight: 500;
      backdrop-filter: blur(4px);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      background: rgba(245, 248, 250, 0.15);
    }
    .message {
      display: flex;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message.ai {
      align-self: flex-start;
    }
    .message.system {
      align-self: center;
      max-width: 90%;
    }
    .bubble {
      padding: 16px 20px;
      border-radius: 28px;
      box-shadow: 0 6px 16px -8px rgba(0,20,40,0.2);
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      backdrop-filter: blur(4px);
    }
    .user .bubble {
      background: #1e3b5c;
      color: white;
      border-bottom-right-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .ai .bubble {
      background: rgba(255,255,255,0.8);
      color: #1a2e44;
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(255,255,255,0.9);
    }
    .system .bubble {
      background: rgba(230, 240, 250, 0.7);
      color: #1f3a5f;
      font-size: 0.9rem;
      border-radius: 40px;
      padding: 10px 20px;
      border: 1px dashed rgba(70, 130, 200, 0.5);
    }
    .input-footer {
      padding: 20px 28px;
      background: rgba(255,255,255,0.3);
      border-top: 1px solid rgba(0,0,0,0.05);
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      background: white;
      border-radius: 40px;
      display: flex;
      align-items: flex-end;
      padding: 8px 8px 8px 20px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 8px 18px -14px #1a2e44;
    }
    .input-wrapper textarea {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 0;
      max-height: 120px;
      resize: none;
      font-size: 1rem;
      background: transparent;
      font-family: inherit;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-left: 8px;
    }
    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      border: 1px solid rgba(0,0,0,0.08);
      color: #1e3b5c;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      box-shadow: 0 4px 10px -8px black;
    }
    .circle-btn:hover {
      background: #e6edf6;
      border-color: #a0b8d0;
    }
    #fileInput {
      display: none;
    }
    .messages-area.drag-over {
      background: rgba(180, 210, 240, 0.4);
      transition: 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .messages-area::-webkit-scrollbar,
    .tree::-webkit-scrollbar {
      width: 6px;
    }
    .messages-area::-webkit-scrollbar-thumb,
    .tree::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 20px;
    }
    /* 文件卡片 & 分类结果（直接复用文件管理逻辑） */
    .file-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .file-chip {
      background: rgba(255,255,255,0.2);
      border-radius: 40px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .file-chip i {
      font-size: 1.1rem;
      color: #ffd966;
    }
    .file-chip .file-name {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-chip .file-size {
      opacity: 0.7;
      font-size: 0.8rem;
    }
    .classification-list {
      margin: 12px 0 8px;
      background: rgba(240, 245, 255, 0.5);
      border-radius: 24px;
      padding: 12px 16px;
    }
    .category-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .category-row:last-child {
      border-bottom: none;
    }
    .cat-icon {
      width: 30px;
      color: #2d5c8f;
    }
    .cat-name {
      font-weight: 600;
      min-width: 90px;
    }
    .cat-files {
      color: #2e405b;
    }
    .save-button {
      background: #1e3b5c;
      border: none;
      color: white;
      padding: 12px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 20px -12px #0a1f33;
    }
    .save-button:hover {
      background: #143049;
    }
    .save-button:active {
      transform: scale(0.98);
    }
    .save-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #6c7e94;
    }
    /* 右侧 workspace 条与文件列表 */
    .workspace-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 28px 4px;
      font-size: 0.85rem;
      color: #43526a;
    }
    .workspace-bar span {
      max-width: 70%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace-bar button {
      padding: 4px 10px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.1);
      background: white;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .workspace-files {
      display: none; /* 右侧只显示 workspace 文本，不再列出所有文件 */
    }
    .workspace-file-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.05);
    }
    .workspace-file-item i {
      font-size: 0.9rem;
      color: #3a5f90;
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <!-- 左侧：文件浏览器（静态树） -->
    <div class="file-explorer">
      <div class="explorer-header">
        <i class="fas fa-laptop"></i>
        <h2>此电脑</h2>
        <button id="createFolderBtn" style="margin-left:auto; padding:4px 10px; border-radius:16px; border:1px solid rgba(0,0,0,0.1); background:white; font-size:0.8rem; cursor:pointer;">
          <i class="fas fa-folder-plus"></i> 新建
        </button>
      </div>
      <ul class="tree" id="folderTree">
        <!-- 由 /api/fs/roots 和 /api/fs/list 动态填充真实磁盘目录 -->
      </ul>
      <div class="explorer-footer">
        <i class="fas fa-info-circle"></i> 点击文件夹只在右侧提示，不会真正访问磁盘。
      </div>
    </div>

    <!-- 右侧：巴巴塔聊天室 + 文件拖拽 -->
    <div class="chat-main">
      <div class="header">
        <i class="fas fa-robot"></i>
        <h1>巴巴塔 · 文件聊天助手</h1>
        <span><i class="far fa-folder-open"></i> 本地分类存储</span>
      </div>

      <!-- workspace 选择结果展示 -->
      <div class="workspace-bar">
        <span id="workspacePathLabel">未选择 workspace · 可在左侧点击文件夹或右侧手动指定路径</span>
        <button id="chooseWorkspaceBtn" style="margin-left:auto;" title="手动输入工作空间路径">
          <i class="fas fa-folder-open"></i> 选择工作空间
        </button>
        <button id="refreshWorkspaceBtn" title="刷新当前 workspace 内容" style="margin-left:6px;">
          <i class="fas fa-rotate-right"></i> 刷新
        </button>
      </div>
      <div class="workspace-files" id="workspaceFiles"></div>

      <div class="messages-area" id="messageList">
        <div class="message ai">
          <div class="bubble">
            <i class="fas fa-sparkles" style="margin-right: 8px; color:#2d5c8f;"></i>
            你好，我是 <b>巴巴塔</b>。你可以和我聊天，也可以拖拽/上传文件，我会按类型帮你归类并指导你保存到本地文件夹。
          </div>
        </div>
      </div>

      <div class="input-footer">
        <div class="input-wrapper">
          <textarea id="textInput" placeholder="对巴巴塔说点什么，或拖拽文件到上方区域..." rows="1"></textarea>
          <div class="action-buttons">
            <button class="circle-btn" id="fileUploadBtn" title="上传文件"><i class="fas fa-paperclip"></i></button>
            <button class="circle-btn" id="sendBtn" title="发送"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 隐藏 file input -->
  <input type="file" id="fileInput" multiple>

  <script>
    (function () {
      const messageList = document.getElementById('messageList');
      const textInput = document.getElementById('textInput');
      const sendBtn = document.getElementById('sendBtn');
      const fileUploadBtn = document.getElementById('fileUploadBtn');
      const fileInput = document.getElementById('fileInput');
      const folderTree = document.getElementById('folderTree');
      const createFolderBtn = document.getElementById('createFolderBtn');
      const workspacePathLabel = document.getElementById('workspacePathLabel');
      const workspaceFilesBox = document.getElementById('workspaceFiles');
      const refreshWorkspaceBtn = document.getElementById('refreshWorkspaceBtn');
      const chooseWorkspaceBtn = document.getElementById('chooseWorkspaceBtn');

      let selectedPath = null;
      let selectedLi = null;
      let pendingMetaGroup = null;   // 等待用户填写描述/关键词的上传组
      let fileIndex = [];            // 当前 workspace 的文件索引

      // 存储文件分组（参考 file-manager.html）
      window.fileGroups = [];

      // 简单 uuid 生成（用于会话 ID）
      function uuidv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }
      const conversationId = uuidv4();

      // WebSocket 连接：只使用 group_message + babata
      let ws = null;
      let wsConnected = false;

      function connectWebSocket() {
        const url = 'ws://localhost:8000/ws';
        ws = new WebSocket(url);

        ws.onopen = () => {
          wsConnected = true;
          addSystemMessage('✅ 已连接到服务器，开始和巴巴塔对话吧。');
        };

        ws.onclose = () => {
          wsConnected = false;
          addSystemMessage('⚠️ 与服务器的连接已关闭，如需继续对话请刷新页面。', true);
        };

        ws.onerror = (e) => {
          console.error('WebSocket 错误:', e);
          addSystemMessage('❌ WebSocket 出错，请检查后端是否已启动。', true);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            handleWSMessage(data);
          } catch (err) {
            console.error('解析 WebSocket 消息失败:', err);
          }
        };
      }

      function sendWS(type, payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type, ...payload }));
        } else {
          addSystemMessage('⚠️ WebSocket 未连接，无法发送消息。', true);
        }
      }

      function handleWSMessage(data) {
        const t = data.type;
        if (t === 'ai_thinking' && data.ai_model === 'babata') {
          addSystemMessage('巴巴塔正在思考...', false);
        } else if (t === 'ai_response' && data.ai_model === 'babata') {
          addAIMessage(data.content || '');
        } else if (t === 'ai_error' || t === 'error') {
          addSystemMessage('❌ ' + (data.message || '发生错误'), true);
        } else if (t === 'group_message_complete') {
          // 可忽略或做提示
        } else if (t === 'ai_stream' && data.ai_model === 'babata') {
          // 目前后端巴巴塔不走流式，这里预留
          addAIMessage(data.content || '');
        }
      }

      // UI 辅助函数
      function addMessage(sender, htmlContent, isSystem = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = isSystem ? 'message system' : `message ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = htmlContent;
        messageDiv.appendChild(bubble);
        messageList.appendChild(messageDiv);
        messageList.scrollTop = messageList.scrollHeight;
      }

      function addUserMessage(text) {
        addMessage('user', `<span>${text}</span>`);
      }

      function addAIMessage(text) {
        addMessage('ai', `<i class="fas fa-robot" style="margin-right:6px;"></i>${text}`);
      }

      function addSystemMessage(text, isError) {
        const icon = isError ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-info-circle"></i>';
        addMessage('system', `${icon} ${text}`, true);
      }

      // 文本发送逻辑：只选中巴巴塔
      function handleUserText() {
        const text = textInput.value.trim();
        if (!text) return;

        addUserMessage(text);
        textInput.value = '';
        textInput.style.height = 'auto';

        // 如果有待填写的文件元数据，则两步解析：先描述，再关键词
        if (pendingMetaGroup && selectedPath && text) {
          if (!pendingMetaGroup.step || pendingMetaGroup.step === 'desc') {
            // 第一步：仅填写描述
            pendingMetaGroup.description = text.trim();
            pendingMetaGroup.step = 'keywords';
            addAIMessage(
              `已记录描述：“${pendingMetaGroup.description}”。\n\n` +
              `请在下一条消息中补充【关键词】（可选），示例：\n` +
              `电源方案, V1.0, 客户A\n\n` +
              `多个关键词请用逗号或顿号分隔；如果不需要关键词，可以直接回复“无”。`
            );
            return;
          } else if (pendingMetaGroup.step === 'keywords') {
            let keywords = [];
            if (text.trim() && text.trim() !== '无') {
              keywords = text
                .split(/[,，]/)
                .map(s => s.trim())
                .filter(Boolean);
            }
            const entry = {
              id: uuidv4(),
              workspace_path: pendingMetaGroup.workspacePath,
              temp_dir: pendingMetaGroup.tempDir,
              files: pendingMetaGroup.fileNames,
              description: pendingMetaGroup.description || '',
              keywords,
              uploaded_at: new Date().toISOString(),
              stored_at: null,
              target_dir: null,
            };
            fileIndex.push(entry);
            // 本地持久化（按 workspace 维度）
            try {
              const key = 'babata_file_index_' + pendingMetaGroup.workspacePath;
              localStorage.setItem(key, JSON.stringify(fileIndex));
            } catch (_) {}
            // 同步到后端
            fetch('http://localhost:8000/api/fs/file_index/add', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(entry),
            }).catch(() => {});
            addAIMessage(
              `✅ 已为这组文件建立索引：\n` +
              `描述：${entry.description || '（无）'}\n` +
              `关键词：${entry.keywords.join('，') || '（无）'}\n` +
              `<a href="#" data-edit-entry="${entry.id}" style="color:#2563eb;text-decoration:underline;">编辑这组文件信息</a>`
            );
            pendingMetaGroup = null;
            // 不再把这两步元数据输入转发给后端作为对话内容
            return;
          }
        } else {
          // 普通对话消息：发送前根据关键词尝试匹配索引
          if (fileIndex.length > 0) {
            const lower = text.toLowerCase();
            const matches = [];
            for (const entry of fileIndex) {
              for (const kw of entry.keywords || []) {
                if (!kw) continue;
                if (lower.includes(kw.toLowerCase())) {
                  matches.push({ entry, kw });
                  break;
                }
              }
              if (matches.length >= 3) break;
            }
            if (matches.length > 0) {
              let html = `<div style="margin-bottom:6px;font-weight:600;"><i class="fas fa-folder-open"></i> 根据关键词为你找到这些文件：</div>`;
              matches.forEach((m, idx) => {
                const e = m.entry;
                const when = e.stored_at || e.uploaded_at;
                const timeLabel = when ? new Date(when).toLocaleString() : '时间未知';
                const baseDir = e.target_dir || e.temp_dir;
                const fileButtons = (e.files || []).map(fname => {
                  const fullPath = baseDir ? `${baseDir}/${fname}` : fname;
                  return `<button data-open-file="${fullPath}" style="margin:2px 4px;padding:2px 8px;font-size:0.8rem;border-radius:12px;border:1px solid rgba(0,0,0,0.1);background:white;cursor:pointer;">
                    <i class="fas fa-file"></i> ${fname}
                  </button>`;
                }).join('');
                html += `<div style="margin:6px 0;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,0.7);">
                  <div><span style="font-weight:600;">描述：</span>${e.description || '（无）'}</div>
                  <div><span style="font-weight:600;">关键词：</span>${(e.keywords || []).join('，') || '（无）'}</div>
                  <div><span style="font-weight:600;">时间：</span>${timeLabel}</div>
                  <div style="margin-top:4px;"><span style="font-weight:600;">文件：</span>${fileButtons || '（无文件）'}</div>
                </div>`;
              });
              addAIMessage(html);
            }
          }
        }

        const payload = {
          conversation_id: conversationId,
          message: text,
          selected_ais: [
            {
              id: 'babata',
              name: '巴巴塔',
              enabled: true,
            },
          ],
          skip_event_triggers: false,
          event_max_tokens: undefined,
        };
        sendWS('group_message', payload);
      }

      // 文件分类逻辑（直接复用 file-manager.html 的实现）
      function getFileCategory(fileName) {
        const ext = fileName.split('.').pop()?.toLowerCase() || '';
        if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'].includes(ext)) return '🖼️ 图片';
        if (['pdf', 'doc', 'docx', 'txt', 'xls', 'xlsx', 'ppt', 'pptx', 'md', 'rtf'].includes(ext)) return '📄 文档';
        if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return '📦 压缩包';
        if (['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a'].includes(ext)) return '🎵 音频';
        if (['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'webm'].includes(ext)) return '🎬 视频';
        if (['js', 'py', 'java', 'html', 'css', 'cpp', 'c', 'json', 'xml'].includes(ext)) return '💻 代码';
        return '📁 其他';
      }

      async function handleFiles(files) {
        if (!files || files.length === 0) return;
        if (!selectedPath) {
          addSystemMessage('⚠️ 请先在左侧选择 workspace 目录（点击某个文件夹），再拖入文件。', true);
          return;
        }
        const fileArray = Array.from(files);

        // 1. 在对话中显示“用户上传文件”
        let filesHtml = `<div style="margin-bottom:6px;"><i class="fas fa-cloud-upload-alt"></i> 上传了 ${fileArray.length} 个文件</div>`;
        filesHtml += `<div class="file-grid">`;
        fileArray.forEach(f => {
          const size = f.size < 1024 ? f.size + ' B' : (f.size / 1024).toFixed(1) + ' KB';
          filesHtml += `<div class="file-chip"><i class="fas fa-file"></i><span class="file-name">${f.name}</span><span class="file-size">${size}</span></div>`;
        });
        filesHtml += `</div>`;
        addMessage('user', filesHtml);

        // 2. 本地分类
        const categories = fileArray.map(f => getFileCategory(f.name));
        const groupIndex = window.fileGroups.length;
        window.fileGroups.push({ files: fileArray, categories });

        const catCount = {};
        categories.forEach(cat => { catCount[cat] = (catCount[cat] || 0) + 1; });

        let catHtml = `<div class="classification-list">`;
        catHtml += `<div style="margin-bottom: 12px; font-weight:600;"><i class="fas fa-tags"></i> 分类结果（本地判断）</div>`;
        for (const [cat, count] of Object.entries(catCount)) {
          catHtml += `<div class="category-row"><span class="cat-icon">${cat.split(' ')[0]}</span><span class="cat-name">${cat}</span><span class="cat-files">${count} 个文件</span></div>`;
        }
        catHtml += `</div>`;
        catHtml += `<button class="save-button" data-group-index="${groupIndex}" id="saveBtn-${groupIndex}"><i class="fas fa-folder-open"></i> 保存这组文件到本地文件夹</button>`;
        if (!window.showDirectoryPicker) {
          catHtml += `<div style="margin-top: 10px; font-size:0.8rem; background: #f0e6c5; padding: 6px 12px; border-radius: 40px;"><i class="fas fa-info-circle"></i> 当前浏览器不支持“文件夹保存”，将改为下载模拟。</div>`;
        }
        addMessage('ai', catHtml);

        // 6. 自动上传到当前 workspace 的临时目录
        try {
          const formData = new FormData();
          formData.append('parent_path', selectedPath);
          fileArray.forEach(f => formData.append('files', f));
          const resp = await fetch('http://localhost:8000/api/fs/upload_temp', {
            method: 'POST',
            body: formData,
          });
          if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text || resp.statusText);
          }
          const data = await resp.json();
          const tempDir = data.workspace_temp || (selectedPath + '\\\\.ai_workspace_tmp');
          addSystemMessage(`✅ 已将本次上传的文件保存到 workspace 临时目录：${tempDir}`, false);

          // 记录一个待填写元数据的上传组，并由巴巴塔发问
          const savedNames = (data.saved || []).map(p => {
            try {
              return p.split(/[\\/]/).pop();
            } catch {
              return p;
            }
          });
          pendingMetaGroup = {
            workspacePath: selectedPath,
            tempDir: tempDir,
            fileNames: savedNames.length ? savedNames : fileArray.map(f => f.name),
          };
          addAIMessage(
            `我已经收到并保存了这组文件。\n\n` +
            `请在下一条消息中为它们填写【描述】和【关键词】，格式示例：\n` +
            `PCB 原理图 V1.0 | 电源方案, V1.0, 客户A\n\n` +
            `（描述在前，后面用竖线 | 分隔关键词，关键词之间用逗号或顿号分隔）`
          );
        } catch (e) {
          addSystemMessage('❌ 上传到 workspace 临时目录失败：' + (e.message || e), true);
        }

        setTimeout(() => {
          const saveBtn = document.getElementById(`saveBtn-${groupIndex}`);
          if (saveBtn) {
            saveBtn.replaceWith(saveBtn.cloneNode(true));
            const newBtn = document.getElementById(`saveBtn-${groupIndex}`);
            newBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              saveGroupToDisk(groupIndex, newBtn);
            });
          }
        }, 50);
      }

      async function saveGroupToDisk(groupIndex, btnElement) {
        const group = window.fileGroups[groupIndex];
        if (!group || group.files.length === 0) {
          addSystemMessage('没有可保存的文件', true);
          return;
        }
        btnElement.disabled = true;
        btnElement.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> 准备保存...`;

        try {
          if (!window.showDirectoryPicker) {
            for (let i = 0; i < group.files.length; i++) {
              const file = group.files[i];
              const url = URL.createObjectURL(file);
              const a = document.createElement('a');
              a.href = url;
              a.download = file.name;
              a.style.display = 'none';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              await new Promise(r => setTimeout(r, 100));
            }
            addSystemMessage(`已下载 ${group.files.length} 个文件到下载文件夹（未分类，因浏览器限制）。`, false);
            btnElement.disabled = false;
            btnElement.innerHTML = `<i class="fas fa-folder-open"></i> 保存这组文件到本地文件夹`;
            return;
          }

          const dirHandle = await window.showDirectoryPicker({
            id: 'babata-file-chat-save',
            mode: 'readwrite',
            startIn: 'documents'
          });

          btnElement.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> 正在写入...`;

          const files = group.files;
          const categories = group.categories;
          const subDirHandles = {};

          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const cat = categories[i];
            let folderName = cat.replace(/[^\w\u4e00-\u9fa5]/g, '');
            if (folderName.length === 0) folderName = '其他';

            if (!subDirHandles[folderName]) {
              subDirHandles[folderName] = await dirHandle.getDirectoryHandle(folderName, { create: true });
            }
            const subDir = subDirHandles[folderName];
            const fileHandle = await subDir.getFileHandle(file.name, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
          }

          addSystemMessage(`✅ 成功保存 ${files.length} 个文件到所选文件夹，已按分类放入子文件夹。`, false);
        } catch (err) {
          addSystemMessage(`❌ 保存失败: ${err.message || '用户取消'}`, true);
        } finally {
          btnElement.disabled = false;
          btnElement.innerHTML = `<i class="fas fa-folder-open"></i> 保存这组文件到本地文件夹`;
        }
      }

      // 拖拽上传区域（在 messages-area 上）
      messageList.addEventListener('dragover', (e) => {
        e.preventDefault();
        messageList.classList.add('drag-over');
      });
      messageList.addEventListener('dragleave', (e) => {
        e.preventDefault();
        messageList.classList.remove('drag-over');
      });
      messageList.addEventListener('drop', (e) => {
        e.preventDefault();
        messageList.classList.remove('drag-over');
        const items = e.dataTransfer.items;
        if (items) {
          const files = [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.kind === 'file') {
              const file = item.getAsFile();
              if (file) files.push(file);
            }
          }
          if (files.length > 0) handleFiles(files);
        } else {
          const files = e.dataTransfer.files;
          if (files.length > 0) handleFiles(files);
        }
      });
      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', (e) => e.preventDefault());

      // 消息区域的事件代理：打开文件 / 编辑文件索引
      messageList.addEventListener('click', (e) => {
        const target = e.target;
        if (!target) return;

        const openBtn = target.closest ? target.closest('[data-open-file]') : null;
        if (openBtn) {
          e.preventDefault();
          const fullPath = (openBtn as HTMLElement).getAttribute('data-open-file');
          if (fullPath) {
            const url = 'http://localhost:8000/api/fs/download?path=' + encodeURIComponent(fullPath);
            window.open(url, '_blank');
          }
          return;
        }

        const editLinkEl = target.closest ? target.closest('[data-edit-entry]') : null;
        if (editLinkEl) {
          e.preventDefault();
          const entryId = (editLinkEl as HTMLElement).getAttribute('data-edit-entry');
          if (!entryId) return;
          const entry = fileIndex.find(e => e.id === entryId);
          if (!entry) {
            alert('未找到对应的文件索引记录');
            return;
          }
          const newDesc = prompt('修改描述：', entry.description || '');
          if (newDesc === null) return;
          const newKwStr = prompt('修改关键词（逗号或顿号分隔，可选）：', (entry.keywords || []).join('，')) || '';
          const newKeywords = newKwStr
            .split(/[,，]/)
            .map(s => s.trim())
            .filter(Boolean);
          entry.description = newDesc.trim();
          entry.keywords = newKeywords;
          // 更新本地索引
          const idx = fileIndex.findIndex(e => e.id === entryId);
          if (idx >= 0) fileIndex[idx] = entry;
          try {
            const key = 'babata_file_index_' + entry.workspace_path;
            localStorage.setItem(key, JSON.stringify(fileIndex));
          } catch (_) {}
          // 同步到后端（用相同 id 覆盖）
          fetch('http://localhost:8000/api/fs/file_index/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(entry),
          }).catch(() => {});
          addSystemMessage(`✅ 已更新该组文件的描述/关键词。`, false);
        }
      });

      // 按钮事件
      fileUploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          handleFiles(files);
        }
        fileInput.value = '';
      });
      sendBtn.addEventListener('click', handleUserText);
      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleUserText();
        }
      });
      textInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
      });

      // ===== 左侧树 + 后端文件系统 API 绑定 =====
      async function fetchJSON(url, options) {
        const resp = await fetch(url, options);
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(text || resp.statusText);
        }
        return resp.json();
      }

      async function loadRoots() {
        try {
          const roots = await fetchJSON('http://localhost:8000/api/fs/roots');
          folderTree.innerHTML = '';
          roots.forEach(root => {
            const li = document.createElement('li');
            li.className = 'drive-item';
            li.dataset.path = root.path;
            li.innerHTML = `
              <div class="folder-item">
                <span class="icon"><i class="fas fa-hard-drive"></i></span>
                <span class="name">${root.name}</span>
                <span class="expand-icon"><i class="fas fa-chevron-right"></i></span>
              </div>
              <ul></ul>
            `;
            const expandIcon = li.querySelector('.expand-icon');
            expandIcon.addEventListener('click', (e) => toggleTreeFolder(e, li, root.path));
            li.querySelector('.name').addEventListener('click', () => openFolder(root.path, li));
            folderTree.appendChild(li);
          });
        } catch (e) {
          addSystemMessage('❌ 读取磁盘根目录失败: ' + e.message, true);
        }
      }

      async function loadChildren(li, path) {
        const ul = li.querySelector('ul');
        if (!ul) return;
        if (ul.dataset.loaded === '1') return;
        ul.innerHTML = '';
        try {
          const items = await fetchJSON('http://localhost:8000/api/fs/list?path=' + encodeURIComponent(path));
          items.forEach(item => {
            const childLi = document.createElement('li');
            childLi.dataset.path = item.path;
            if (item.is_dir) {
              childLi.className = 'drive-item';
              childLi.innerHTML = `
                <div class="folder-item">
                  <span class="icon"><i class="fas fa-folder"></i></span>
                  <span class="name">${item.name}</span>
                  <span class="expand-icon"><i class="fas fa-chevron-right"></i></span>
                </div>
                <ul></ul>
              `;
              const expandIcon = childLi.querySelector('.expand-icon');
              expandIcon.addEventListener('click', (e) => toggleTreeFolder(e, childLi, item.path));
              childLi.querySelector('.name').addEventListener('click', () => openFolder(item.path, childLi));
            } else {
              childLi.innerHTML = `
                <div class="folder-item">
                  <span class="icon"><i class="fas fa-file"></i></span>
                  <span class="name">${item.name}</span>
                </div>
              `;
              childLi.querySelector('.name').addEventListener('click', () => openFolder(item.path, childLi));
            }
            ul.appendChild(childLi);
          });
          ul.dataset.loaded = '1';
        } catch (e) {
          addSystemMessage('❌ 读取目录失败: ' + e.message, true);
        }
      }

      window.toggleTreeFolder = function (event, li, path) {
        event.stopPropagation();
        if (!li) {
          const iconSpan = event.currentTarget;
          const folderItem = iconSpan.closest('.folder-item');
          li = folderItem.closest('li');
          path = li?.dataset.path;
        }
        if (!li || !path) return;

        li.classList.toggle('collapsed');
        const icon = li.querySelector('.expand-icon i');
        if (icon) {
          icon.classList.toggle('fa-chevron-down');
          icon.classList.toggle('fa-chevron-right');
        }
        if (!li.classList.contains('collapsed')) {
          loadChildren(li, path);
        }
      };

      async function loadWorkspaceFiles(path) {
        if (!path) {
          workspaceFilesBox.innerHTML = '';
          workspacePathLabel.textContent = '未选择 workspace · 请在左侧或下方按钮中选择一个文件夹';
          return;
        }
        workspacePathLabel.textContent = `当前 workspace: ${path}`;
        try {
          const items = await fetchJSON('http://localhost:8000/api/fs/list?path=' + encodeURIComponent(path));
          workspaceFilesBox.innerHTML = '';
          items.slice(0, 50).forEach(item => {
            const div = document.createElement('div');
            div.className = 'workspace-file-item';
            div.innerHTML = `
              <i class="fas ${item.is_dir ? 'fa-folder' : 'fa-file'}"></i>
              <span title="${item.name}">${item.name}</span>
            `;
            workspaceFilesBox.appendChild(div);
          });
          // 同时加载该 workspace 下已有的文件索引
          try {
            const stored = localStorage.getItem('babata_file_index_' + path);
            if (stored) {
              fileIndex = JSON.parse(stored) || [];
            } else {
              fileIndex = [];
            }
          } catch (_) {
            fileIndex = [];
          }
          // 后端为主进行同步（若失败则使用本地）
          try {
            const idx = await fetchJSON('http://localhost:8000/api/fs/file_index?workspace_path=' + encodeURIComponent(path));
            if (Array.isArray(idx)) {
              fileIndex = idx;
              const key = 'babata_file_index_' + path;
              localStorage.setItem(key, JSON.stringify(fileIndex));
            }
          } catch (_) {}
        } catch (e) {
          addSystemMessage('❌ 读取 workspace 内容失败: ' + e.message, true);
        }
      }

      window.openFolder = function (path, li) {
        selectedPath = path;
        if (selectedLi && selectedLi !== li) {
          selectedLi.classList.remove('selected');
        }
        if (li) {
          selectedLi = li;
          li.classList.add('selected');
        }
        addSystemMessage(`📂 已选择 workspace 文件夹: ${path}`, false);
        loadWorkspaceFiles(path);
      };

      // 新建文件夹
      createFolderBtn.addEventListener('click', async () => {
        if (!selectedPath) {
          alert('请先在左侧选择一个父目录（点击目录名称）');
          return;
        }
        const name = prompt('新建文件夹名称：');
        if (!name || !name.trim()) return;
        const desc = prompt('文件夹描述（可选）：') || '';
        const kwStr = prompt('关键词（逗号或顿号分隔，可选）：') || '';
        const keywords = kwStr
          .split(/[,，]/)
          .map(s => s.trim())
          .filter(Boolean);
        try {
          await fetchJSON('http://localhost:8000/api/fs/create_folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              parent_path: selectedPath,
              name: name.trim(),
              description: desc,
              keywords,
            }),
          });
          addSystemMessage(`✅ 已在 ${selectedPath} 下创建文件夹：${name}`, false);
          // 刷新当前选中目录的子节点
          if (selectedLi) {
            const ul = selectedLi.querySelector('ul');
            if (ul) {
              ul.dataset.loaded = '0';
              await loadChildren(selectedLi, selectedPath);
            }
          } else {
            await loadRoots();
          }
        } catch (e) {
          alert('新建文件夹失败：' + e.message);
        }
      });

      // 手动刷新 workspace 内容
      refreshWorkspaceBtn.addEventListener('click', () => {
        if (!selectedPath) {
          alert('还没有选择 workspace，请先在左侧点击一个文件夹。');
          return;
        }
        loadWorkspaceFiles(selectedPath);
      });

      // 右侧手动输入 workspace 路径
      chooseWorkspaceBtn.addEventListener('click', () => {
        const current = selectedPath || '';
        const val = prompt('请输入工作空间路径（例如 D:\\\\项目\\\\Demo）：', current);
        if (!val) return;
        const path = val.trim();
        if (!path) return;
        selectedPath = path;
        selectedLi = null;
        addSystemMessage(`📂 已手动设置 workspace 文件夹: ${path}`, false);
        loadWorkspaceFiles(path);
      });

      // 初始化
      window.addEventListener('load', () => {
        connectWebSocket();
        loadRoots();
      });
    })();
  </script>
</body>
</html>
