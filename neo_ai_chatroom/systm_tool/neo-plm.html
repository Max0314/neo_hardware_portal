<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>NEO Product life cycle · 全屏时间轴</title>
  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 图标库 -->
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
  <style>
    /* —— 全局NEO风格，全屏适配 —— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F3F8FC;
      color: #0C334E;
      line-height: 1.5;
      background-image: radial-gradient(circle at 5% 30%, rgba(0,180,216,0.02) 0%, transparent 35%),
                        radial-gradient(circle at 95% 70%, rgba(37,99,235,0.02) 0%, transparent 40%);
      min-height: 100vh;
      width: 100%;
      padding: 1.2rem 1.5rem; /* 全屏：仅保留极小边距 */
    }

    .neo-container {
      max-width: 100%;
      margin: 0 auto;
    }

    /* —— 导航栏 —— */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .neo-chip {
      background: linear-gradient(145deg, #121F2F, #1B3A4E);
      color: white;
      font-weight: 700;
      font-size: 1.4rem;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      box-shadow: 0 10px 18px -10px rgba(0,60,100,0.3);
    }

    .logo-text {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(150deg, #052137, #15507B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text span {
      background: linear-gradient(145deg, #2A7DE1, #0CA3B0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-icon {
      color: #3C6478;
      font-size: 1.3rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 6px 14px 6px 6px;
      border-radius: 40px;
      box-shadow: 0 6px 12px rgba(0,32,64,0.04);
    }
    .avatar {
      background: linear-gradient(145deg, #1F6390, #1D7AB0);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* —— 页面主标题 —— */
    .page-header {
      margin-bottom: 2rem;
    }
    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.15;
      color: #082433;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .page-sub {
      font-size: 1rem;
      color: #3B617C;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* —— 团队快速更新区 —— */
    .team-update-section {
      background: white;
      border-radius: 28px;
      padding: 1.2rem 1.8rem;
      margin-bottom: 2.2rem;
      box-shadow: 0 12px 24px -16px rgba(12,60,90,0.12);
      border: 1px solid rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .team-avatars {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team-avatars .avatar {
      width: 44px;
      height: 44px;
      font-size: 1rem;
      border: 2px solid white;
    }
    .team-avatars .avatar-more {
      background: #EAF1F9;
      color: #1F6C9E;
      font-weight: 600;
    }
    .update-input {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      background: #F6FAFD;
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
      border: 1px solid #D6E3EC;
    }
    .update-input input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.6rem 0;
      font-size: 0.9rem;
      color: #0F4B66;
      outline: none;
    }
    .update-input button {
      background: #1F6C9E;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1.4rem;
      border-radius: 60px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    /* —— 项目列表（垂直独占一行）—— */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 项目卡片 */
    .project-card {
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 1.6rem 2rem;
      box-shadow: 0 18px 30px -12px rgba(0,45,70,0.08);
      transition: all 0.26s ease;
      border: 1px solid rgba(255,255,255,0.6);
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 40px -14px rgba(21,96,150,0.14);
    }

    /* 项目头部 */
    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .project-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .project-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #E7F0FA, #DBECFA);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1F6C9E;
      font-size: 1.4rem;
    }
    .project-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0A2A3F;
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #1F6C9E;
      font-size: 1.3rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
    }
    .toggle-btn:hover {
      background: #EAF1F9;
    }

    /* 项目元数据 */
    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #EDF2F6;
      font-size: 0.9rem;
      color: #3C748C;
    }
    .project-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* —— 全局时间轴（项目级）—— */
    .project-timeline {
      margin-bottom: 1.8rem;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-size: 0.75rem;
      color: #557D99;
    }
    .timeline-scale {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 32px;
      background: #ECF3F7;
      border-radius: 20px;
      overflow: hidden;
    }
    .timeline-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 0 2px rgba(0,0,0,0.1);
      position: relative;
      transition: 0.1s;
    }
    .segment-evt { background: #2E9B8B; }    /* 完成/进行中 绿松 */
    .segment-dvt { background: #3A7CA5; }    /* 进行中 深蓝 */
    .segment-pvt { background: #6A8FA0; }    /* 未开始/计划 灰蓝 */
    .segment-completed { background: #1C8B6C; } /* 已完成 深绿 */
    .today-marker {
      position: absolute;
      top: -6px;
      width: 2px;
      height: 44px;
      background: #C05A5A;
      border-radius: 2px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .today-marker::after {
      content: '今日';
      position: absolute;
      top: -18px;
      left: -16px;
      font-size: 0.6rem;
      background: #C05A5A;
      color: white;
      padding: 2px 6px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* —— 三阶段水平卡片（含具体到天进展）—— */
    .phase-details {
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .phase-details.collapsed {
      display: none;
    }

    .phases-row {
      display: flex;
      gap: 24px;
      margin-top: 0.8rem;
    }

    .phase-card {
      flex: 1;
      background: #F9FDFF;
      border-radius: 24px;
      padding: 1.2rem 1.4rem;
      border: 1px solid #E3ECF3;
      display: flex;
      flex-direction: column;
    }
    .phase-card.locked {
      background: #F2F6F9;
      border-color: #D0DCE5;
      opacity: 0.8;
    }
    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .phase-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0F4B66;
    }
    .phase-label i {
      color: #1F6C9E;
    }
    .phase-status {
      font-size: 0.7rem;
      background: #E3F0F7;
      padding: 4px 10px;
      border-radius: 60px;
      color: #11698E;
      font-weight: 600;
    }
    .phase-status.risk { background: #FFECDC; color: #B85A2C; }
    .phase-status.done { background: #DCF2E8; color: #1C8B6C; }

    /* 具体到天的进展 */
    .day-progress {
      margin: 0.6rem 0 0.8rem;
      display: flex;
      flex-direction: column;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #2F6077;
      margin-bottom: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #E0E9EF;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1F6C9E;
      border-radius: 20px;
      width: 0%;
    }

    .phase-tasks {
      list-style: none;
      padding: 0;
      margin: 0.2rem 0 0.2rem;
    }
    .phase-tasks li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #EDF2F6;
      font-size: 0.8rem;
    }
    .phase-tasks li:last-child { border-bottom: none; }
    .task-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .task-assignee {
      background: #D4E6F1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: #0F4B66;
    }
    .update-small-btn {
      background: transparent;
      border: 1px solid #C1D9E8;
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #1D5980;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: default;
    }

    /* 项目底部 */
    .project-footer {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #E4ECF2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #3C748C;
    }
    .member-stack {
      display: flex;
      align-items: center;
    }
    .member-stack .mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #D4E6F1;
      border: 2px solid white;
      margin-left: -6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0F4B66;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .member-stack .mini-avatar:first-child { margin-left: 0; }

    /* —— 全局动态时间轴 —— */
    .recent-activity {
      margin-top: 3rem;
      padding-top: 1.8rem;
      border-top: 1px solid rgba(37,99,235,0.08);
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: white;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .activity-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1F6390;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .activity-desc { flex: 1; font-size: 0.9rem; }
    .activity-time { color: #6A8FA0; font-size: 0.75rem; }

    @media (max-width: 1000px) {
      .phases-row { flex-direction: column; }
    }

    /* 新增项目弹窗 */
    .plm-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12,52,78,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .plm-modal-overlay.show { display: flex; }
    .plm-modal {
      background: white;
      border-radius: 24px;
      box-shadow: 0 24px 48px -12px rgba(0,0,0,0.2);
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .plm-modal-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid #E4ECF2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: #0A2A3F;
    }
    .plm-modal-close { background: none; border: none; font-size: 1.5rem; color: #6A8FA0; cursor: pointer; padding: 0 4px; }
    .plm-modal-body { padding: 1.5rem; }
    .plm-form-group { margin-bottom: 1rem; }
    .plm-form-group label { display: block; font-weight: 600; font-size: 0.9rem; color: #0F4B66; margin-bottom: 6px; }
    .plm-form-group input[type="text"],
    .plm-form-group input[type="file"] { width: 100%; padding: 10px 12px; border: 1px solid #D6E3EC; border-radius: 12px; font-size: 0.95rem; }
    .plm-form-group input:focus { outline: none; border-color: #1F6C9E; }
    .plm-modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #E4ECF2; display: flex; justify-content: flex-end; gap: 12px; }
    .plm-btn { padding: 10px 20px; border-radius: 60px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; }
    .plm-btn-primary { background: #1F6C9E; color: white; }
    .plm-btn-primary:hover { background: #15507B; }
    .plm-btn-secondary { background: #EAF1F9; color: #0F4B66; }
    .plm-current-badge { background: #1C8B6C; color: white; font-size: 0.7rem; padding: 4px 12px; border-radius: 60px; font-weight: 600; margin-left: 8px; }
    .plm-set-current-btn { background: #E3F0F7; color: #1F6C9E; border: 1px solid #B8D4E8; padding: 6px 14px; border-radius: 60px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .plm-set-current-btn:hover { background: #D4E6F1; }
    .project-title-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .project-card .product-img-thumb { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; border: 1px solid #E3ECF3; }
    .nav-add-btn { background: #1F6C9E; color: white; border: none; padding: 8px 18px; border-radius: 60px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .nav-add-btn:hover { background: #15507B; }
    .nav-home-link { color: #1F6C9E; text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; }
    .nav-home-link:hover { text-decoration: underline; }
  </style>
    <link rel="stylesheet" href="../neo-tools-theme.css" />
</head>
<body class="neo-tool">
  <div class="neo-container">

    <!-- ========= 导航栏 ========= -->
    <div class="navbar">
      <div class="logo-area">
        <div class="neo-chip"><i class="fas fa-microchip"></i></div>
        <div class="logo-text">NEO Citcuit <span>AI</span></div>
        <a href="../" class="nav-home-link" style="margin-left: 12px;"><i class="fas fa-home"></i> 返回主页</a>
      </div>
      <div class="nav-right">
        <button type="button" class="nav-add-btn" id="btnAddProject"><i class="fas fa-plus"></i> 新增项目</button>
        <i class="fas fa-search nav-icon"></i>
        <i class="far fa-bell nav-icon"></i>
        <div class="user-profile">
          <div class="avatar">张</div>
          <span style="font-weight: 500;">张工</span>
          <i class="fas fa-chevron-down" style="color: #8EA9BC;"></i>
        </div>
      </div>
    </div>

    <!-- ========= 页面主标题 ========= -->
    <div class="page-header">
      <div class="page-title">
        <i class="fas fa-sync-alt" style="color: #2C7DA0;"></i> NEO Product life cycle
        <span style="background: rgba(24,100,170,0.1); padding: 6px 20px; border-radius: 60px; font-size: 0.85rem; font-weight: 600;">
          <i class="fas fa-timeline"></i> 时间轴·天级追踪
        </span>
      </div>
      <div class="page-sub">
        <span>每个项目独占一行 · 时间轴串联三阶段 · 折叠后完全收缩</span>
        <span><i class="fas fa-users"></i> 项目组 12人</span>
      </div>
    </div>

    <!-- ========= 团队快速更新区 ========= -->
    <div class="team-update-section">
      <div class="team-avatars">
        <span class="avatar">李</span>
        <span class="avatar">王</span>
        <span class="avatar">陈</span>
        <span class="avatar">赵</span>
        <span class="avatar avatar-more">+8</span>
      </div>
      <div class="update-input">
        <input type="text" placeholder="发布项目状态更新 @成员 或输入进展...">
        <button><i class="fas fa-paper-plane"></i> 更新</button>
      </div>
    </div>

    <!-- ========= 项目列表（由 JS 从 localStorage 渲染）========= -->
    <div class="project-list" id="projectListRoot"></div>

    <!-- 新增项目弹窗 -->
    <div class="plm-modal-overlay" id="plmModal">
      <div class="plm-modal">
        <div class="plm-modal-header">
          <span>新增项目</span>
          <button type="button" class="plm-modal-close" id="plmModalClose">&times;</button>
        </div>
        <div class="plm-modal-body">
          <div class="plm-form-group">
            <label>项目编号 <span style="color:#B85A2C;">*</span></label>
            <input type="text" id="plmProjectCode" placeholder="如 PRJ-2025-001">
          </div>
          <div class="plm-form-group">
            <label>项目名称 <span style="color:#B85A2C;">*</span></label>
            <input type="text" id="plmProjectName" placeholder="如 5G 前端模组">
          </div>
          <div class="plm-form-group">
            <label>产品名称 <span style="color:#B85A2C;">*</span></label>
            <input type="text" id="plmProductName" placeholder="如 5G 射频前端模组">
          </div>
          <div class="plm-form-group">
            <label>产品类型</label>
            <input type="text" id="plmProductType" placeholder="如 NEO无线、车规级、可穿戴">
          </div>
          <div class="plm-form-group">
            <label>产品图片</label>
            <input type="file" id="plmProductImage" accept="image/*">
          </div>
        </div>
        <div class="plm-modal-footer">
          <button type="button" class="plm-btn plm-btn-secondary" id="plmModalCancel">取消</button>
          <button type="button" class="plm-btn plm-btn-primary" id="plmModalSave">保存</button>
        </div>
      </div>
    </div>

    <!-- ========= 全局动态时间轴 ========= -->
    <div class="recent-activity">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:1.2rem;">
        <h3 style="font-size:1.2rem;"><i class="fas fa-clock-rotate-left" style="color:#1E749C;"></i> 全项目动态</h3>
        <span style="color:#3C748C; font-size:0.8rem;"><i class="fas fa-sync-alt"></i> 实时</span>
      </div>
      <div class="activity-list">
        <div class="activity-item"><span class="activity-avatar">李</span><span class="activity-desc"><strong>李铭</strong> 更新 DVT阶段 · 电气参数完成65%</span><span class="activity-time">2h前</span></div>
        <div class="activity-item"><span class="activity-avatar">刘</span><span class="activity-desc"><strong>刘阳</strong> DDR5眼图测试完成，DVT 45%</span><span class="activity-time">昨天</span></div>
        <div class="activity-item"><span class="activity-avatar">王</span><span class="activity-desc"><strong>王雅</strong> 标记 EVT时序风险</span><span class="activity-time">3h前</span></div>
        <div class="activity-item"><span class="activity-avatar">张</span><span class="activity-desc"><strong>张川</strong> PVT小批量试产启动</span><span class="activity-time">1d前</span></div>
      </div>
    </div>

    <!-- ========= 底部 ========= -->
    <div style="margin-top: 2.5rem; color: #58809B; font-size: 0.8rem; display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,0.02); padding-top: 1.2rem;">
      <span><i class="fas fa-shield-husked"></i> NEO Product life cycle · 全屏时间轴 v1.0</span>
      <span><i class="fas fa-robot"></i> 深度求索 智能引擎</span>
    </div>

  </div> <!-- 容器结束 -->

  <script>
    (function() {
      var STORAGE_KEY = 'neo_plm_projects';
      var CURRENT_KEY = 'neo_plm_current_project_id';

      function uuid() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      var defaultProjects = [
        { id: 'neo-plm-def-1', 项目编号: 'PRJ-2025-001', 项目名称: '5G 前端模组', 产品名称: '5G 射频前端模组', 产品类型: 'NEO无线', 产品图片: null, icon: 'fa-microchip', 负责人: '李铭', 截止日期: '2025-08-30', 标签: 'NEO无线', 状态: 'EVT完成 · DVT进行中', timeline: { evt: '25%', dvt: '35%', pvt: '40%', today: '42%', dvtLabel: 'DVT 65%' } },
        { id: 'neo-plm-def-2', 项目编号: 'PRJ-2025-002', 项目名称: 'DDR5 控制器', 产品名称: 'DDR5 内存控制器', 产品类型: '车规级', 产品图片: null, icon: 'fa-memory', 负责人: '刘阳', 截止日期: '2025-09-15', 标签: '车规级', 状态: 'EVT完成 · DVT 45%', timeline: { evt: '20%', dvt: '38%', pvt: '42%', today: '38%', dvtLabel: 'DVT 45%' } },
        { id: 'neo-plm-def-3', 项目编号: 'PRJ-2025-003', 项目名称: 'PMIC 电源芯片', 产品名称: '多路电源管理芯片', 产品类型: '可穿戴', 产品图片: null, icon: 'fa-bolt', 负责人: '王雅', 截止日期: '2025-07-20', 标签: '可穿戴', 状态: 'EVT进行中 · 风险', timeline: { evt: '32%', dvt: '35%', pvt: '33%', today: '18%', evtLabel: 'EVT 30%' } },
        { id: 'neo-plm-def-4', 项目编号: 'PRJ-2025-004', 项目名称: 'WiFi7 FEM', 产品名称: 'WiFi7 前端模组', 产品类型: '6GHz', 产品图片: null, icon: 'fa-wifi', 负责人: '张川', 截止日期: '2025-10-10', 标签: '6GHz', 状态: 'EVT/DVT完成 · PVT 25%', timeline: { evt: '20%', dvt: '28%', pvt: '52%', today: '60%', pvtLabel: 'PVT 25%' } }
      ];

      function loadProjects() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        var list = defaultProjects.slice();
        saveProjects(list);
        return list;
      }

      function saveProjects(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }

      function getCurrentId() {
        return localStorage.getItem(CURRENT_KEY) || '';
      }

      function setCurrentId(id) {
        localStorage.setItem(CURRENT_KEY, id || '');
      }

      var projectListRoot = document.getElementById('projectListRoot');
      var plmModal = document.getElementById('plmModal');
      var plmModalClose = document.getElementById('plmModalClose');
      var plmModalCancel = document.getElementById('plmModalCancel');
      var plmModalSave = document.getElementById('plmModalSave');
      var btnAddProject = document.getElementById('btnAddProject');
      var plmProjectCode = document.getElementById('plmProjectCode');
      var plmProjectName = document.getElementById('plmProjectName');
      var plmProductName = document.getElementById('plmProductName');
      var plmProductType = document.getElementById('plmProductType');
      var plmProductImage = document.getElementById('plmProductImage');

      function escapeHtml(s) {
        if (s == null) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function renderProjects() {
        var list = loadProjects();
        var currentId = getCurrentId();
        if (list.length === 0) {
          projectListRoot.innerHTML = '<div style="text-align:center; padding:3rem; color:#6A8FA0;">暂无项目，点击右上角「新增项目」创建</div>';
          return;
        }
        projectListRoot.innerHTML = list.map(function(p) {
          var isCurrent = p.id === currentId;
          var thumb = p.产品图片 ? '<img class="product-img-thumb" src="' + escapeHtml(p.产品图片) + '" alt="">' : '<span class="project-icon"><i class="fas ' + (p.icon || 'fa-folder') + '"></i></span>';
          var evtW = (p.timeline && p.timeline.evt) || '25%';
          var dvtW = (p.timeline && p.timeline.dvt) || '35%';
          var pvtW = (p.timeline && p.timeline.pvt) || '40%';
          var todayLeft = (p.timeline && p.timeline.today) || '42%';
          var dvtLabel = (p.timeline && p.timeline.dvtLabel) || 'DVT';
          var evtLabel = (p.timeline && p.timeline.evtLabel);
          var pvtLabel = (p.timeline && p.timeline.pvtLabel);
          return (
            '<div class="project-card" data-id="' + escapeHtml(p.id) + '">' +
              '<div class="project-header">' +
                '<div class="project-title-wrap">' +
                  '<div class="project-title">' + thumb + '<span class="project-name">' + escapeHtml(p.项目名称) + '</span>' +
                  (isCurrent ? '<span class="plm-current-badge">当前项目</span>' : '<button type="button" class="plm-set-current-btn" data-id="' + escapeHtml(p.id) + '"><i class="fas fa-check-circle"></i> 设为当前项目</button>') +
                '</div>' +
                '<button class="toggle-btn" data-toggle><i class="fas fa-chevron-up"></i></button>' +
              '</div>' +
              '<div class="project-meta">' +
                '<span><i class="fas fa-hashtag"></i> ' + escapeHtml(p.项目编号) + '</span>' +
                '<span><i class="fas fa-box"></i> ' + escapeHtml(p.产品名称) + '</span>' +
                '<span><i class="fas fa-tag"></i> ' + escapeHtml(p.产品类型 || '-') + '</span>' +
                '<span><i class="fas fa-flag"></i> ' + escapeHtml(p.负责人 || '') + '</span>' +
                '<span><i class="fas fa-calendar"></i> 截止 ' + escapeHtml(p.截止日期 || '') + '</span>' +
              '</div>' +
              '<div class="project-timeline">' +
                '<div class="timeline-header"><span>EVT</span><span>DVT</span><span>PVT</span></div>' +
                '<div class="timeline-scale">' +
                  '<div class="timeline-segment segment-completed" style="width:' + evtW + ';">' + (evtLabel || 'EVT') + '</div>' +
                  '<div class="timeline-segment segment-dvt" style="width:' + dvtW + ';">' + dvtLabel + '</div>' +
                  '<div class="timeline-segment segment-pvt" style="width:' + pvtW + ';">' + (pvtLabel || 'PVT') + '</div>' +
                  '<div class="today-marker" style="left:' + todayLeft + ';"></div>' +
                '</div>' +
              '</div>' +
              '<div class="phase-details">' +
                '<div class="phases-row">' +
                  '<div class="phase-card"><div class="phase-header"><span class="phase-label"><i class="fas fa-flask"></i> EVT</span><span class="phase-status done">已完成</span></div><div class="day-progress"><span class="progress-text">进度 100%</span><div class="progress-bar-bg"><div class="progress-fill" style="width:100%; background:#1C8B6C;"></div></div></div></div>' +
                  '<div class="phase-card"><div class="phase-header"><span class="phase-label"><i class="fas fa-cubes"></i> DVT</span><span class="phase-status">进行中</span></div><div class="day-progress"><span class="progress-text">' + escapeHtml(dvtLabel) + '</span><div class="progress-bar-bg"><div class="progress-fill" style="width:65%;"></div></div></div></div>' +
                  '<div class="phase-card locked"><div class="phase-header"><span class="phase-label"><i class="fas fa-industry"></i> PVT</span><span class="phase-status" style="background:#E3ECF3;">未解锁</span></div><div class="day-progress"><span class="progress-text">待启动</span><div class="progress-bar-bg"><div class="progress-fill" style="width:0%;"></div></div></div></div>' +
                '</div>' +
              '</div>' +
              '<div class="project-footer">' +
                '<span><i class="fas fa-barcode"></i> ' + escapeHtml(p.项目编号) + ' · ' + escapeHtml(p.产品名称) + '</span>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        projectListRoot.querySelectorAll('[data-toggle]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var card = btn.closest('.project-card');
            var details = card.querySelector('.phase-details');
            var timeline = card.querySelector('.project-timeline');
            var icon = btn.querySelector('i');
            if (details.classList.contains('collapsed')) {
              details.classList.remove('collapsed');
              if (timeline) timeline.style.display = 'block';
              icon.className = 'fas fa-chevron-up';
            } else {
              details.classList.add('collapsed');
              if (timeline) timeline.style.display = 'none';
              icon.className = 'fas fa-chevron-down';
            }
          });
        });
        projectListRoot.querySelectorAll('.plm-set-current-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            setCurrentId(btn.dataset.id);
            renderProjects();
          });
        });
      }

      function openModal() {
        plmProjectCode.value = '';
        plmProjectName.value = '';
        plmProductName.value = '';
        plmProductType.value = '';
        plmProductImage.value = '';
        plmModal.classList.add('show');
      }

      function closeModal() {
        plmModal.classList.remove('show');
      }

      plmModalSave.addEventListener('click', function() {
        var code = plmProjectCode.value.trim();
        var name = plmProjectName.value.trim();
        var productName = plmProductName.value.trim();
        var productType = plmProductType.value.trim();
        if (!code || !name || !productName) {
          alert('请填写项目编号、项目名称、产品名称');
          return;
        }
        var imageData = null;
        var file = plmProductImage.files[0];
        if (file) {
          var reader = new FileReader();
          reader.onload = function() {
            imageData = reader.result;
            finishAdd(code, name, productName, productType, imageData);
          };
          reader.readAsDataURL(file);
        } else {
          finishAdd(code, name, productName, productType, null);
        }
      });

      function finishAdd(code, name, productName, productType, imageData) {
        var list = loadProjects();
        var newP = {
          id: uuid(),
          项目编号: code,
          项目名称: name,
          产品名称: productName,
          产品类型: productType,
          产品图片: imageData,
          icon: 'fa-folder',
          负责人: '',
          截止日期: '',
          标签: productType || '',
          状态: '新建',
          timeline: { evt: '33%', dvt: '34%', pvt: '33%', today: '10%', dvtLabel: 'DVT', evtLabel: 'EVT', pvtLabel: 'PVT' }
        };
        list.push(newP);
        saveProjects(list);
        closeModal();
        renderProjects();
      }

      plmModalClose.addEventListener('click', closeModal);
      plmModalCancel.addEventListener('click', closeModal);
      btnAddProject.addEventListener('click', openModal);

      renderProjects();
    })();
  </script>
</body>
</html>
