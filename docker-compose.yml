# 硬件研发部管理系统（htmlsystm）+ NEO（neo_ai_chatroom），部署于 NeoFlow 平台。
# 数据库不在本栈内：平台要求应用服务器上不得自行运行数据库，统一连 NeoFlowData。
#
# 用法（在仓库根目录下）：
#   1. cp .env.example .env 并填写 MYSQL_HOST/USER/PASSWORD/DATABASE 与各 API 密钥
#   2. bash migration/deploy.sh          # 推荐：build + 健康/DB 检查 + 开放登录
#      bash migration/deploy.sh --no-build   # 仅重启，不重建镜像
#   3. 网关只监听 127.0.0.1:GATEWAY_PUBLISH_PORT 的明文 HTTP，由平台 Nginx 终止 TLS 后反代；
#      对外地址见 PUBLIC_BASE_URL — 管理系统在 /neo_hardware/，NEO 在 /neo_hardware/neo/
#
# 说明：若仅部署 NEO 聊天室，仍可使用子目录 neo_ai_chatroom/docker-compose.yml

# 北京时间：TZ 环境变量 + 挂载宿主机 localtime（宿主机须先执行 migration/setup-timezone.sh）

x-stack-autoheal-labels: &stack_autoheal_labels
  stack.autoheal: "true"

services:
  # 本栈不含数据库。NeoFlow 平台要求应用服务器上不得自行运行数据库，统一使用
  # NeoFlowData（内网 172.16.0.244:3306）。连接参数全部来自 .env，勿写死。
  htmlsystm:
    build:
      context: .
      dockerfile: htmlsystm/Dockerfile
    container_name: stack-htmlsystm
    restart: unless-stopped
    labels:
      <<: *stack_autoheal_labels
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: ${MYSQL_HOST:?请在 .env 中设置 MYSQL_HOST（NeoFlowData 内网地址）}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      SERVER_PORT: "8000"
      USE_MONITOR: "0"
      ENABLE_GZIP: ${HTMLSYSTM_ENABLE_GZIP:-0}
      NEO_INTERNAL_SECRET: ${NEO_INTERNAL_SECRET:?请在 .env 中设置 NEO_INTERNAL_SECRET}
      NEO_INTERNAL_URL: http://backend:8000
      # BI 中心使用数据导出接口查询密钥（X-API-Key）；留空则 /api/export/usage/* 返回 503，不影响其它功能
      BI_EXPORT_API_KEY: ${BI_EXPORT_API_KEY:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-zzw}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      # 宜搭(YiDa)表单同步：系统令牌 + 物料库默认密码；空值不影响其它功能，仅同步时校验
      YIDA_SYSTEM_TOKEN: ${YIDA_SYSTEM_TOKEN:-}
      YIDA_LIBRARY_PASSWORD: ${YIDA_LIBRARY_PASSWORD:-}
      YIDA_SPECIAL_MATERIAL_FORMS: ${YIDA_SPECIAL_MATERIAL_FORMS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PUBLIC_PATH_PREFIX: ${PUBLIC_PATH_PREFIX:-/neo_hardware}
      # 知识库 ID 勿在此写 ${VAR:-}：未在 .env 配置时会注入空字符串，覆盖 config.py 默认值导致钉钉 API 404
      # 需要覆盖时在 .env 中设置 DINGTALK_WORKSPACE_ID / DINGTALK_DOC_PARENT_NODE_ID / DINGTALK_DOC_OPERATOR_UNIONID
      # 避免 master 阻塞钉钉全量同步导致 healthcheck 超时（RK3568 等）
      SKIP_DINGTALK_SYNC_ON_START: ${SKIP_DINGTALK_SYNC_ON_START:-1}
      # 启动后在后台批量抓取快捷链接图标（后台线程，不阻塞健康检查）；设为 1 可跳过
      SKIP_QUICK_LINK_ICON_FETCH_ON_START: ${SKIP_QUICK_LINK_ICON_FETCH_ON_START:-1}
      # 启动批量抓取时每条链接之间的间隔（秒）
      QUICK_LINK_ICON_FETCH_INTERVAL_SEC: ${QUICK_LINK_ICON_FETCH_INTERVAL_SEC:-1.5}
      # worker 就绪后再延迟多少秒开始抓取（避免与首屏请求抢资源）
      QUICK_LINK_ICON_FETCH_DELAY_SEC: ${QUICK_LINK_ICON_FETCH_DELAY_SEC:-15}
      # 单次 HTTP 超时（秒）；内网失败时越小越快结束批量任务
      QUICK_LINK_ICON_FETCH_TIMEOUT: ${QUICK_LINK_ICON_FETCH_TIMEOUT:-3}
      PYTHONDONTWRITEBYTECODE: "1"
      # 便于 docker logs 看到启动过程（默认 WARNING 时日志几乎为空）
      CONSOLE_LOG_LEVEL: INFO
      HTMLSYSTM_GUNICORN_WORKERS: ${HTMLSYSTM_GUNICORN_WORKERS:-2}
      HTMLSYSTM_GUNICORN_THREADS: ${HTMLSYSTM_GUNICORN_THREADS:-20}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-10}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - htmlsystm_data:/app/data
      - htmlsystm_uploads:/app/uploads
    networks:
      - default
      - report_audit_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 90s

  backend:
    build:
      context: ./neo_ai_chatroom
      dockerfile: Dockerfile.backend
    container_name: stack-neo-backend
    restart: unless-stopped
    labels:
      <<: *stack_autoheal_labels
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CHATROOM_DATA_DIR: /data
      HTMLSYSTM_INTERNAL_URL: http://htmlsystm:8000
      HTMLSYSTM_AUTH_TIMEOUT_SEC: ${HTMLSYSTM_AUTH_TIMEOUT_SEC:-45}
      NEO_INTERNAL_SECRET: ${NEO_INTERNAL_SECRET:?请在 .env 中设置 NEO_INTERNAL_SECRET}
      MYSQL_HOST: ${MYSQL_HOST:?请在 .env 中设置 MYSQL_HOST（NeoFlowData 内网地址）}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      # 嵌入式/低内存设备建议关闭 Chroma，避免启动失败
      MEMORY_VECTOR_BACKEND: ${MEMORY_VECTOR_BACKEND:-none}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ai_chatroom_data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=8)",
        ]
      interval: 15s
      timeout: 12s
      retries: 10
      start_period: 120s
    depends_on:
      htmlsystm:
        condition: service_healthy

  web:
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    build:
      context: ./neo_ai_chatroom
      dockerfile: Dockerfile.web
      args:
        # 国内网络慢时可加速 npm ci；海外可设为空或 registry.npmjs.org
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_NEO_PATH_PREFIX: ${NEO_PATH_PREFIX:-/neo_hardware/neo}
    container_name: stack-neo-web
    restart: unless-stopped
    labels:
      <<: *stack_autoheal_labels
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: stack-gateway
    restart: unless-stopped
    labels:
      <<: *stack_autoheal_labels
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 仅绑定回环。TLS 由平台 Nginx 在 443 终止，本网关只需明文 HTTP，
      # 内层再套一层自签证书没有安全收益，只会多一份证书要维护。
      - "127.0.0.1:${GATEWAY_PUBLISH_PORT:-39020}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/gateway-health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 勿挂到 conf.d/：会被主配置在 http 层二次加载，导致 location 指令报错
      - ./gateway/proxy_locations.conf:/etc/nginx/proxy_locations.conf:ro
    networks:
      - default
      - report_audit_internal
    depends_on:
      htmlsystm:
        condition: service_healthy
      web:
        condition: service_healthy
      backend:
        condition: service_healthy

  # 默认不启动（需外网拉镜像）。启用: docker compose --profile autoheal up -d autoheal
  autoheal:
    profiles: ["autoheal"]
    image: willfarrell/autoheal:latest
    container_name: stack-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: stack.autoheal
      AUTOHEAL_INTERVAL: ${AUTOHEAL_INTERVAL:-30}
      AUTOHEAL_START_PERIOD: ${AUTOHEAL_START_PERIOD:-300}
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: ${AUTOHEAL_DEFAULT_STOP_TIMEOUT:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ai_chatroom_data:
  htmlsystm_data:
  htmlsystm_uploads:

networks:
  # 跨 Compose 的稳定服务网络：报告平台通过此网络校验 htmlsystm 会话，
  # gateway 也通过服务名访问报告平台。网络不对宿主机或公网发布端口。
  report_audit_internal:
    name: neo-hardware-report-audit
