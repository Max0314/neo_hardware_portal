# Nginx配置示例：实现基于会话ID的粘性会话（Sticky Session）
# 使用方法：将此配置添加到Nginx的server块中

upstream gunicorn_backend {
    # 基于session_id cookie进行哈希，实现会话亲和性
    # 同一session_id的请求会被路由到同一个worker
    hash $cookie_session_id consistent;
    
    # Gunicorn后端服务器列表
    server 127.0.0.1:8000;
    # 如果有多个Gunicorn实例，可以添加更多：
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    
    # 保持连接，减少连接建立开销
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # 替换为您的域名或IP
    
    # 如果使用HTTPS，取消下面的注释
    # listen 443 ssl;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    
    # 客户端最大请求体大小（用于文件上传）
    client_max_body_size 100M;
    
    # 请求头大小限制（支持大量Cookie）
    large_client_header_buffers 4 16k;
    
    # 代理到Gunicorn
    location / {
        proxy_pass http://gunicorn_backend;
        
        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;  # 钉钉浏览器兼容
        
        # 保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 缓冲设置（优化性能）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 禁用代理缓存（确保实时数据）
        proxy_cache off;
    }
    
    # 静态文件直接由Nginx提供（可选，如果使用Nginx提供静态文件）
    # location /static/ {
    #     alias /path/to/your/static/files/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}

