<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告详情 - 硬件研发部管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/neo-systm.css" />
    <script src="/js/transfer-utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a252f, #2c3e50);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(26, 37, 47, 0.8);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #3498db;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header h1 {
            color: #3498db;
            font-size: 2.2rem;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #34495e;
        }
        .btn-back:hover {
            background: #2c3e50;
        }
        .btn-edit {
            background: #f39c12;
        }
        .btn-edit:hover {
            background: #e67e22;
        }
        
        .announcement-content {
            line-height: 1.7;
            margin-bottom: 30px;
        }
        .announcement-title {
            color: #000000;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .announcement-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #F7FAFD;
            border: 1px solid rgba(34, 116, 172, 0.1);
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .meta-label {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .meta-value {
            color: #000000;
            font-weight: bold;
        }
        .priority-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .priority-low {
            background: rgba(52, 152, 219, 0.3);
        }
        .priority-normal {
            background: rgba(46, 204, 113, 0.3);
        }
        .priority-high {
            background: rgba(243, 156, 18, 0.3);
        }
        .priority-urgent {
            background: rgba(231, 76, 60, 0.6);
        }
        
        .content-body {
            background: #ffffff;
            color: #000000;
            border: 1px solid rgba(34, 116, 172, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            min-height: 200px;
        }
        .content-body img {
            max-width: 100%;
            border-radius: 5px;
            margin: 10px 0;
        }
        .content-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .content-body th, .content-body td {
            border: 1px solid #3498db;
            padding: 10px;
            text-align: left;
        }
        .content-body th {
            background: rgba(52, 152, 219, 0.3);
        }
        
        .attachments {
            margin-top: 30px;
        }
        .attachments h3 {
            color: #3498db;
            margin-bottom: 15px;
        }
        .attachment-list {
            display: grid;
            gap: 10px;
        }
        .attachment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            border-left: 3px solid #3498db;
        }
        .attachment-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .attachment-icon {
            color: #3498db;
            font-size: 1.2rem;
        }
        .attachment-size {
            color: #000000;
            font-size: 0.9rem;
        }
        .btn-download {
            background: #27ae60;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        .btn-download:hover {
            background: #219653;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #3498db;
        }
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #e74c3c;
        }
        
        .versions-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #3498db;
        }
        .versions-section h3 {
            color: #000000;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .version-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #95a5a6;
            transition: all 0.3s;
        }
        .version-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }
        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .version-title {
            font-weight: bold;
            color: #000000;
            font-size: 1.1rem;
        }
        .version-meta {
            display: flex;
            gap: 15px;
            color: #000000;
            font-size: 0.9rem;
        }
        .version-content {
            color: #000000;
            line-height: 1.6;
            max-height: 200px;
            overflow: hidden;
            position: relative;
        }
        .version-content.expanded {
            max-height: none;
        }
        .version-toggle {
            color: #3498db;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            text-decoration: underline;
        }
        .version-toggle:hover {
            color: #2980b9;
        }
        .no-versions {
            text-align: center;
            padding: 40px 20px;
            color: #000000;
        }
        
        @media (max-width: 768px) {
            .announcement-meta {
                flex-direction: column;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body class="neo-systm-home">
    <div class="container neo-page-wrap">
        <div class="neo-page-header">
            <div class="header-brand-column neo-header-brand-inline">
                <img src="/logo.png" alt="CHANGHONG NeoNet" class="brand-logo-top-index" />
                <div class="header-brand-main">
                    <div class="header-title" style="margin:0;">
                        <div class="logo-text-index">NEO Hardware <span>AI</span></div>
                        <div class="sys-subtitle-index">硬件研发部管理系统</div>
                    </div>
                </div>
            </div>
            <div class="neo-header-actions">
                <span class="neo-page-title">公告详情</span>
                <div id="edit-button-container" style="display: none;">
                    <button class="neo-btn neo-btn-warning" onclick="editAnnouncement()">编辑公告</button>
                </div>
                <a href="/announcement" class="neo-btn neo-btn-secondary">← 返回公告栏</a>
            </div>
        </div>
        
        <div id="announcement-content">
            <div class="loading">
                <p>正在加载公告详情...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取公告ID
            const pathParts = window.location.pathname.split('/');
            const announcementId = pathParts[pathParts.length - 1];
            
            if (!announcementId) {
                showError('无效的公告ID');
                return;
            }
            
            loadAnnouncement(announcementId);
            // 注意：checkUserTodo 会在 displayAnnouncement 中调用，不需要在这里调用
        });
        
        function loadAnnouncement(announcementId) {
            fetch(`/api/announcement/announcement/${announcementId}`, {
                credentials: 'include'
            })
                .then(response => {
                    // 检查Content-Type，如果不是JSON，可能是重定向到登录页面
                    const contentType = response.headers.get('content-type') || '';
                    if (!contentType.includes('application/json')) {
                        // 如果是401未认证，跳转到登录页面（带上redirect参数）
                        if (response.status === 401 || response.status === 302) {
                            const currentPath = window.location.pathname;
                            window.location.href = `/login?redirect=${encodeURIComponent(currentPath)}`;
                            return;
                        }
                        // 尝试读取文本，看看是否是HTML错误页面
                        return response.text().then(text => {
                            throw new Error(`服务器返回了非JSON格式的响应 (${response.status})`);
                        });
                    }
                    
                    if (!response.ok) {
                        // 如果是401未认证，跳转到登录页面（带上redirect参数）
                        if (response.status === 401) {
                            const currentPath = window.location.pathname;
                            window.location.href = `/login?redirect=${encodeURIComponent(currentPath)}`;
                            return;
                        }
                        // 尝试解析JSON错误信息
                        return response.json().then(data => {
                            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
                        }).catch(() => {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        });
                    }
                    return response.json();
                })
                .then(announcement => {
                    if (announcement) {
                        displayAnnouncement(announcement, announcementId);
                    }
                })
                .catch(error => {
                    // 如果已经跳转到登录页面，不显示错误
                    if (window.location.pathname === '/login') {
                        return;
                    }
                    showError(error.message || '加载公告失败');
                });
        }
        
        function displayAnnouncement(announcement, announcementId) {
            const container = document.getElementById('announcement-content');
            
            // 如果没有传入announcementId，从announcement对象中获取
            if (!announcementId && announcement.id) {
                announcementId = announcement.id;
            }
            
            const priorityClass = `priority-${announcement.priority || 'normal'}`;
            const priorityText = getPriorityText(announcement.priority);
            const boardName = getBoardName(announcement.board_id);
            
            let html = `
                <div class="announcement-content">
                    <h1 class="announcement-title">${announcement.title}</h1>
                    
                    <div class="announcement-meta">
                        <div class="meta-item">
                            <span class="meta-label">发起人</span>
                            <span class="meta-value">${announcement.original_author || announcement.author || '未知'}</span>
                        </div>
                        ${announcement.last_editor && announcement.last_editor !== announcement.original_author ? `
                        <div class="meta-item">
                            <span class="meta-label">最后编辑人</span>
                            <span class="meta-value">${announcement.last_editor}</span>
                        </div>
                        ${announcement.last_edit_time ? `
                        <div class="meta-item">
                            <span class="meta-label">最后编辑时间</span>
                            <span class="meta-value">${formatDate(announcement.last_edit_time)}</span>
                        </div>
                        ` : ''}
                        ` : ''}
                        <div class="meta-item">
                            <span class="meta-label">公告栏</span>
                            <span class="meta-value">${boardName}</span>
                        </div>
                        ${announcement.sub_board_id ? `
                        <div class="meta-item">
                            <span class="meta-label">二级公告栏</span>
                            <span class="meta-value">${announcement.sub_board_name || announcement.sub_board_id}</span>
                        </div>
                        ` : ''}
                        <div class="meta-item">
                            <span class="meta-label">优先级</span>
                            <span class="meta-value priority-tag ${priorityClass}">${priorityText}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">发布时间</span>
                            <span class="meta-value">${formatDate(announcement.publish_time || announcement.created_time)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">状态</span>
                            <span class="meta-value">${getStatusText(announcement.status)}</span>
                        </div>
                        ${announcement.status === 'approved' && announcement.approver ? `
                        <div class="meta-item">
                            <span class="meta-label">审核人</span>
                            <span class="meta-value">${announcement.approver}</span>
                        </div>
                        ${announcement.approve_time ? `
                        <div class="meta-item">
                            <span class="meta-label">审核时间</span>
                            <span class="meta-value">${formatDate(announcement.approve_time)}</span>
                        </div>
                        ` : ''}
                        ` : ''}
                        ${announcement.status === 'pending' ? `
                        <div class="meta-item" style="color: #f39c12; font-weight: bold;">
                            <span class="meta-label">⚠️ 提示</span>
                            <span class="meta-value">此公告正在审核中，审核通过后将重新发布</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="content-body">
                        ${announcement.content || '暂无内容'}
                    </div>
                    
                    <!-- 待办任务按钮区域 -->
                    <div id="todo-button-container" style="display: none; margin-top: 30px; padding-top: 20px; border-top: 2px solid #f39c12; text-align: center;">
                        <button id="complete-todo-btn" class="btn" style="background: #f39c12; color: white; padding: 12px 24px; font-size: 1rem; border-radius: 5px; cursor: pointer; border: none; font-weight: bold;" onclick="completeTodo('${announcementId}')">
                            <i class="fas fa-check-circle"></i> 已阅读，完成待办
                        </button>
                    </div>
                    
                    <!-- 知识库文档链接区域 -->
                    ${announcement.knowledge_doc_url ? `
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #3498db; text-align: center;">
                        <a href="${announcement.knowledge_doc_url}" target="_blank" class="btn" style="background: #3498db; color: white; padding: 12px 24px; font-size: 1rem; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: bold;">
                            <i class="fas fa-book"></i> 查看知识库文档
                        </a>
                    </div>
                    ` : ''}
                    </div>
            `;
            
            // 显示附件
            if (announcement.attachments && announcement.attachments.length > 0) {
                html += `
                    <div class="attachments">
                        <h3>附件下载</h3>
                        <div class="attachment-list">
                `;
                
                announcement.attachments.forEach((attachment, attIndex) => {
                    const size = (attachment.size / 1024).toFixed(1);
                    const downloadUrl = `/api/announcement/attachment/${announcement.id}/by-index/${attIndex}`;
                    html += `
                        <div class="attachment-item">
                            <div class="attachment-info">
                                <span class="attachment-icon">📎</span>
                                <div>
                                    <div>${escapeHtml(attachment.name)}</div>
                                    <div class="attachment-size">${size} KB</div>
                                </div>
                            </div>
                            <button class="btn btn-download" data-download-url="${downloadUrl}" data-filename="${encodeURIComponent(attachment.name)}">
                                下载
                            </button>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
            container.innerHTML = html;
            TransferUtils.bindDownloadButtons(container);
            
            // 检查用户权限，显示编辑按钮
            checkEditPermission(announcement);
            
            // 检查用户是否有该公告的待办任务（显示"已阅读，完成待办"按钮）
            // 注意：只有已发布的公告（status='approved'）才可能有待办任务
            if (announcementId && announcement.status === 'approved') {
                checkUserTodo(announcementId);
            } else {
                console.log('不检查待办任务:', {
                    hasId: !!announcementId,
                    status: announcement.status,
                    reason: !announcementId ? '无公告ID' : '公告未发布'
                });
            }
            
            // 加载待办完成情况（管理员或公告创建者可见）- 显示在历史版本之前
            if (announcementId) {
                loadTodoStatus(announcementId);
            }
            
            // 如果是已发布的公告，加载历史版本
            // 注意：即使状态不是approved，也可能有历史版本（编辑后状态变为pending）
            if (announcementId) {
                loadVersions(announcementId);
            }
        }
        
        function checkEditPermission(announcement) {
            // 检查用户是否有编辑权限（管理员或公告作者）
            fetch('/api/auth/check')
                .then(response => response.json())
                .then(result => {
                    if (result.authenticated) {
                        const user = result.user;
                        const roles = user.roles || [];
                        const isAdmin = roles.includes('admin') || roles.includes('super_admin') || roles.includes('management');
                        const isAuthor = user.username === announcement.author || user.name === announcement.author;
                        const canEdit = isAdmin || isAuthor;
                        
                        // 只有已发布的公告才能编辑
                        if (announcement.status === 'approved' && canEdit) {
                            document.getElementById('edit-button-container').style.display = 'block';
                        }
                    }
                })
                .catch(error => {
                    console.error('检查权限失败:', error);
                });
        }
        
        function editAnnouncement() {
            const pathParts = window.location.pathname.split('/');
            const announcementId = pathParts[pathParts.length - 1];
            window.location.href = `/announcement-editor?edit=${announcementId}`;
        }
        
        function loadVersions(announcementId) {
            console.log('开始加载历史版本:', announcementId);
            fetch(`/api/announcement/versions/${announcementId}`)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) {
                            console.log('未找到历史版本');
                            return [];
                        }
                        throw new Error('加载历史版本失败');
                    }
                    return response.json();
                })
                .then(versions => {
                    console.log('加载到历史版本:', versions);
                    if (versions && versions.length > 0) {
                        displayVersions(versions, announcementId);
                    } else {
                        console.log('没有历史版本');
                    }
                })
                .catch(error => {
                    console.error('加载历史版本失败:', error);
                });
        }
        
        function displayVersions(versions, announcementId) {
            const container = document.getElementById('announcement-content');
            
            if (!versions || versions.length === 0) {
                console.log('displayVersions: 没有历史版本数据');
                return;
            }
            
            console.log('displayVersions: 开始显示历史版本，数量:', versions.length, 'announcementId:', announcementId);
            
            let html = `
                <div class="versions-section" style="margin-top: 30px; padding-top: 30px; border-top: 2px solid #3498db;">
                    <h3><i class="fas fa-history"></i> 历史版本</h3>
                    <div class="version-list">
            `;
            
            versions.forEach((version, index) => {
                const versionDate = formatDate(version.version || version.publish_time || version.created_time);
                // 移除HTML标签获取纯文本预览
                const textContent = version.content ? version.content.replace(/<[^>]*>/g, '') : '';
                const content = textContent.substring(0, 200);
                const fullContent = version.content || '';
                const hasMore = textContent.length > 200;
                
                // 转义HTML特殊字符，防止XSS
                const escapedContent = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const escapedFullContent = fullContent.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                
                html += `
                    <div class="version-item" style="margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 5px; border-left: 3px solid #9b59b6;">
                        <div class="version-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <div class="version-title" style="font-weight: bold; color: #9b59b6;">版本 ${version.version || versionDate}</div>
                            <div class="version-meta" style="display: flex; gap: 15px; font-size: 0.9rem; color: #95a5a6;">
                                <span>发布时间: ${versionDate}</span>
                                ${version.author ? `<span>作者: ${version.author}</span>` : ''}
                            </div>
                        </div>
                        <div class="version-content" id="version-content-${index}" style="color: #ecf0f1; line-height: 1.6;">
                            ${hasMore ? escapedContent + '...' : textContent}
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            ${hasMore ? `
                            <button class="btn" style="padding: 6px 12px; font-size: 0.9rem; background: #34495e;" onclick="toggleVersionContent(${index}, '${escapedFullContent.replace(/\n/g, '\\n')}')">
                                展开全文
                            </button>
                            ` : ''}
                            <button class="btn" style="padding: 6px 12px; font-size: 0.9rem;" onclick="viewVersionDetail('${announcementId}', '${version.version || versionDate}')">
                                <i class="fas fa-eye"></i> 查看详情
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            // 插入到历史版本之前（如果历史版本已存在）
            const versionsSection = container.querySelector('.versions-section');
            if (versionsSection) {
                // 如果历史版本已存在，插入到它之前
                versionsSection.insertAdjacentHTML('beforebegin', html);
            } else {
                // 如果历史版本不存在，直接追加
            container.innerHTML += html;
            }
            console.log('displayVersions: 历史版本已添加到页面');
        }
        
        function toggleVersionContent(index, fullContent) {
            const contentDiv = document.getElementById(`version-content-${index}`);
            if (!contentDiv) {
                console.error('找不到版本内容元素:', `version-content-${index}`);
                return;
            }
            
            const buttonContainer = contentDiv.nextElementSibling;
            if (!buttonContainer) {
                console.error('找不到按钮容器');
                return;
            }
            
            const toggleButton = buttonContainer.querySelector('button');
            
            if (contentDiv.classList.contains('expanded')) {
                contentDiv.classList.remove('expanded');
                // 移除HTML标签获取纯文本
                const textContent = fullContent.replace(/<[^>]*>/g, '').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/\\n/g, '\n');
                contentDiv.innerHTML = textContent.substring(0, 200) + '...';
                if (toggleButton) {
                    toggleButton.textContent = '展开全文';
                }
            } else {
                contentDiv.classList.add('expanded');
                // 显示完整内容（保留HTML格式）
                const decodedContent = fullContent.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/\\n/g, '\n');
                contentDiv.innerHTML = decodedContent;
                if (toggleButton) {
                    toggleButton.textContent = '收起';
                }
            }
        }
        
        function viewVersionDetail(announcementId, versionNumber) {
            // 在当前页面跳转到历史版本详情
            window.location.href = `/announcement-version/${announcementId}/${versionNumber}`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        
        function showError(message) {
            const container = document.getElementById('announcement-content');
            container.innerHTML = `
                <div class="error">
                    <h3>加载失败</h3>
                    <p>${message}</p>
                    <button class="btn" onclick="window.location.href='/announcement'">返回公告栏</button>
                </div>
            `;
        }
        
        function formatDate(isoString) {
            if (!isoString) return '未知';
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN');
        }
        
        function getPriorityText(priority) {
            const priorityMap = {
                'low': '低',
                'normal': '普通',
                'high': '高',
                'urgent': '紧急'
            };
            return priorityMap[priority] || '普通';
        }
        
        function getBoardName(boardId) {
            const boardMap = {
                'hardware': '硬件研发部',
                'circuit': '电路设计组',
                'structure': '结构组',
                'packaging': '包装标签组',
                'testing': '测试组'
            };
            return boardMap[boardId] || boardId;
        }
        
        function getStatusText(status) {
            const statusMap = {
                'draft': '草稿',
                'pending': '待审核',
                'approved': '已发布',
                'rejected': '已拒绝'
            };
            return statusMap[status] || status;
        }
        
        // 检查用户是否有该公告的待办任务
        function checkUserTodo(announcementId) {
            console.log('开始检查用户待办:', announcementId);
            
            // 确保按钮容器存在，如果不存在则等待一下再重试
            const container = document.getElementById('todo-button-container');
            if (!container) {
                console.warn('待办按钮容器尚未创建，等待100ms后重试...');
                setTimeout(() => checkUserTodo(announcementId), 100);
                return;
            }
            
            fetch(`/api/todo/check/${announcementId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`检查待办失败: HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('待办检查结果:', JSON.stringify(data, null, 2));
                    
                    // 检查所有条件
                    const shouldShow = data.success && data.has_todo && !data.done;
                    console.log('按钮显示条件检查:', {
                        success: data.success,
                        has_todo: data.has_todo,
                        done: data.done,
                        shouldShow: shouldShow
                    });
                    
                    if (shouldShow) {
                        // 有未完成的待办任务，显示按钮
                        const container = document.getElementById('todo-button-container');
                        if (container) {
                            container.style.display = 'block';
                            console.log('✓ 显示待办按钮成功');
                        } else {
                            console.error('✗ 找不到待办按钮容器 (todo-button-container)');
                            // 如果容器不存在，可能是DOM还没渲染完成，延迟重试
                            setTimeout(() => {
                                const retryContainer = document.getElementById('todo-button-container');
                                if (retryContainer) {
                                    retryContainer.style.display = 'block';
                                    console.log('✓ 延迟显示待办按钮成功');
                                }
                            }, 200);
                        }
                    } else {
                        console.log('不显示按钮的原因:', {
                            success: data.success,
                            has_todo: data.has_todo,
                            done: data.done,
                            reason: !data.success ? 'API返回失败' : (!data.has_todo ? '用户无待办' : '待办已完成')
                        });
                    }
                })
                .catch(error => {
                    console.error('检查待办任务失败:', error);
                    // 检查失败不显示错误，因为可能用户确实没有待办
                });
        }
        
        // 加载待办完成情况
        function loadTodoStatus(announcementId) {
            fetch(`/api/todo/list/${announcementId}`)
                .then(response => {
                    if (!response.ok) {
                        // 如果没有权限或没有待办，不显示错误
                        if (response.status === 403 || response.status === 404) {
                            return null;
                        }
                        throw new Error('加载待办状态失败');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.success && data.todos && data.todos.length > 0) {
                        displayTodoStatus(data.todos, data.statistics, announcementId);
                    }
                })
                .catch(error => {
                    // 静默失败，不显示错误（可能是没有权限或没有待办）
                    console.log('加载待办状态失败或无权查看:', error);
                });
        }
        
        // 显示待办完成情况
        function displayTodoStatus(todos, statistics, announcementId) {
            const container = document.getElementById('announcement-content');
            if (!container) return;
            
            // 先移除旧的待办状态区域，避免重复显示
            const existingSection = container.querySelector('.todo-status-section');
            if (existingSection) {
                existingSection.remove();
                console.log('已移除旧的待办状态区域');
            }
            
            // 分离已完成和未完成的待办
            const doneTodos = todos.filter(todo => todo.done);
            const pendingTodos = todos.filter(todo => !todo.done);
            
            let html = `
                <div class="todo-status-section" style="margin-top: 30px; padding-top: 30px; border-top: 2px solid #3498db;">
                    <h3 style="color: #3498db; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-tasks"></i> 待办完成情况
                        <span style="font-size: 0.9rem; color: #95a5a6; font-weight: normal;">
                            (总计: ${statistics.total}人, 已完成: ${statistics.done}人, 待完成: ${statistics.pending}人)
                        </span>
                    </h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <!-- 已完成列表 -->
                        <div class="todo-group" style="background: rgba(39, 174, 96, 0.1); padding: 20px; border-radius: 8px; border-left: 4px solid #27ae60;">
                            <h4 style="color: #27ae60; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-check-circle"></i> 已完成 (${statistics.done}人)
                            </h4>
                            <div class="todo-list" style="max-height: 300px; overflow-y: auto;">
            `;
            
            if (doneTodos.length > 0) {
                doneTodos.forEach(todo => {
                    const name = todo.name || todo.username || '未知用户';
                    const completeTime = todo.complete_time || '';
                    html += `
                        <div class="todo-item" style="padding: 10px; margin-bottom: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="color: #2ecc71; font-weight: bold;">✓ ${name}</div>
                                ${completeTime ? `<div style="font-size: 0.85rem; color: #95a5a6; margin-top: 4px;">完成时间: ${completeTime}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `<div style="color: #95a5a6; text-align: center; padding: 20px;">暂无已完成</div>`;
            }
            
            html += `
                            </div>
                        </div>
                        
                        <!-- 待完成列表 -->
                        <div class="todo-group" style="background: rgba(243, 156, 18, 0.1); padding: 20px; border-radius: 8px; border-left: 4px solid #f39c12;">
                            <h4 style="color: #f39c12; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-clock"></i> 待完成 (${statistics.pending}人)
                            </h4>
                            <div class="todo-list" style="max-height: 300px; overflow-y: auto;">
            `;
            
            if (pendingTodos.length > 0) {
                pendingTodos.forEach(todo => {
                    const name = todo.name || todo.username || '未知用户';
                    html += `
                        <div class="todo-item" style="padding: 10px; margin-bottom: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 5px;">
                            <div style="color: #f39c12; font-weight: bold;">○ ${name}</div>
                        </div>
                    `;
                });
            } else {
                html += `<div style="color: #95a5a6; text-align: center; padding: 20px;">全部已完成</div>`;
            }
            
            html += `
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 插入到历史版本之前（如果历史版本已存在）
            const versionsSection = container.querySelector('.versions-section');
            if (versionsSection) {
                // 如果历史版本已存在，插入到它之前
                versionsSection.insertAdjacentHTML('beforebegin', html);
            } else {
                // 如果历史版本不存在，直接追加
                container.innerHTML += html;
            }
            console.log('displayTodoStatus: 待办完成情况已添加到页面');
        }
        
        // 完成待办任务
        function completeTodo(announcementId) {
            const button = document.getElementById('complete-todo-btn');
            if (!button) {
                showError('找不到待办按钮');
                return;
            }
            
            if (!announcementId) {
                showError('无法获取公告ID');
                return;
            }
            
            // 禁用按钮，防止重复点击
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
            
            fetch(`/api/todo/update/${announcementId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    done: true
                })
            })
            .then(response => {
                // 先尝试解析JSON，即使状态码不是200
                return response.json().then(data => {
                if (!response.ok) {
                        throw new Error(data.error || `更新待办状态失败 (${response.status})`);
                }
                    return data;
                });
            })
            .then(data => {
                if (data.success) {
                    // 隐藏按钮
                    const container = document.getElementById('todo-button-container');
                    if (container) {
                        container.style.display = 'none';
                    }
                    
                    // 显示成功消息
                    alert('待办任务已完成！');
                    
                    // 重新加载公告内容，确保显示最新状态（loadAnnouncement会自动调用loadTodoStatus）
                    const pathParts = window.location.pathname.split('/');
                    const announcementId = pathParts[pathParts.length - 1];
                    
                    // 延迟一下，确保后端数据已保存
                    setTimeout(() => {
                        // 只重新加载公告内容，loadAnnouncement会自动调用loadTodoStatus和checkUserTodo
                    loadAnnouncement(announcementId);
                    }, 200);
                } else {
                    throw new Error(data.error || '更新待办状态失败');
                }
            })
            .catch(error => {
                console.error('完成待办任务失败:', error);
                const errorMsg = error.message || '请稍后重试';
                alert('完成待办任务失败: ' + errorMsg);
                // 恢复按钮
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-check-circle"></i> 已阅读，完成待办';
            });
        }
    </script>
</body>
</html>
