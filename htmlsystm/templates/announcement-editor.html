        // 清理Word/TXT格式，保留基本段落和换行
        function cleanWordFormat(html) {
            if (!html) return '';
            
            // 创建临时div来解析HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            // 清理不需要的标签和属性
            const unwantedTags = ['meta', 'script', 'style', 'link', 'xml', 'o:p'];
            unwantedTags.forEach(tag => {
                const elements = tempDiv.querySelectorAll(tag);
                elements.forEach(el => el.remove());
            });
            
            // 清理所有元素的样式属性（保留表格结构）
            const allElements = tempDiv.querySelectorAll('*');
            allElements.forEach(el => {
                // 保留表格相关元素的边框等基本样式
                if (el.tagName === 'TABLE' || el.tagName === 'TD' || el.tagName === 'TH' || el.tagName === 'TR') {
                    // 保留表格基本样式
                    el.removeAttribute('class');
                    el.removeAttribute('id');
                    // 清理复杂的style，只保留基本边框
                    if (el.hasAttribute('style')) {
                        const style = el.getAttribute('style');
                        // 只保留border相关样式
                        const borderMatch = style.match(/border[^;]*/gi);
                        if (borderMatch) {
                            el.setAttribute('style', borderMatch.join('; '));
                        } else {
                            el.removeAttribute('style');
                        }
                    }
                } else {
                    // 非表格元素，完全清理样式
                    el.removeAttribute('style');
                    el.removeAttribute('class');
                    el.removeAttribute('id');
                    el.removeAttribute('lang');
                    el.removeAttribute('xml:lang');
                }
            });
            
            // 转换Word特定的标签
            // Word的<p>标签转换为标准段落
            const paragraphs = tempDiv.querySelectorAll('p');
            paragraphs.forEach(p => {
                if (p.parentNode) {
                    const newP = document.createElement('p');
                    newP.innerHTML = p.innerHTML;
                    p.parentNode.replaceChild(newP, p);
                }
            });
            
            // 处理换行：将<br>和多个连续空格转换为标准格式
            let cleanedHtml = tempDiv.innerHTML;
            
            // 清理Word的特殊字符和格式
            cleanedHtml = cleanedHtml
                .replace(/<!--[\s\S]*?-->/g, '') // 删除注释
                .replace(/<o:p>\s*<\/o:p>/gi, '') // 删除Word的o:p标签
                .replace(/<span[^>]*>/gi, '') // 删除span开始标签
                .replace(/<\/span>/gi, '') // 删除span结束标签
                .replace(/<font[^>]*>/gi, '') // 删除font开始标签
                .replace(/<\/font>/gi, '') // 删除font结束标签
                .replace(/&nbsp;/g, ' ') // 转换&nbsp;为普通空格
                .replace(/<p[^>]*>/gi, '<p>') // 简化p标签
                .replace(/<div[^>]*>/gi, '<div>') // 简化div标签
                .replace(/<br\s*\/?>/gi, '<br>') // 标准化br标签
                .trim();
            
            // 先处理段落内的多个空格（在合并段落之前）
            // 使用更精确的正则，只处理段落内的空格，不影响标签
            cleanedHtml = cleanedHtml.replace(/>\s{2,}</g, '> <'); // 标签之间的多个空格合并为一个
            
            // 合并连续的多个空段落为单个空段落（最多保留一个空段落作为段落间距）
            cleanedHtml = cleanedHtml
                .replace(/(<p>\s*<\/p>\s*){3,}/gi, '<p><br></p>') // 3个或更多空段落合并为一个
                .replace(/(<p><br><\/p>\s*){2,}/gi, '<p><br></p>'); // 多个带br的空段落合并为一个
            
            // 删除段落开头和结尾的空段落
            cleanedHtml = cleanedHtml
                .replace(/^(<p>\s*<\/p>\s*)+/gi, '') // 删除开头的空段落
                .replace(/(<p>\s*<\/p>\s*)+$/gi, '') // 删除结尾的空段落
                .replace(/^(<p><br><\/p>\s*)+/gi, '') // 删除开头的带br的空段落
                .replace(/(<p><br><\/p>\s*)+$/gi, ''); // 删除结尾的带br的空段落
            
            // 如果清理后只剩下空白，返回空字符串
            const textOnly = cleanedHtml.replace(/<[^>]*>/g, '').trim();
            if (!textOnly) {
                return '';
            }
            
            return cleanedHtml;
        }
        
        // 从Word/TXT粘贴（完全清理格式，但保留段落结构）
        function pasteAsPlainText() {
            const editor = document.getElementById('content');
            editor.focus();
            
            // 临时禁用默认粘贴处理器，防止重复处理
            if (window.setPasteHandlerActive) {
                window.setPasteHandlerActive(false);
            }
            
            // 直接读取剪贴板内容（使用现代API）
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(text => {
                    if (text) {
                        processPlainTextPaste(text);
                        // 重新启用默认粘贴处理器
                        setTimeout(() => {
                            if (window.setPasteHandlerActive) {
                                window.setPasteHandlerActive(true);
                            }
                        }, 500);
                    } else {
                        showMessage('剪贴板中没有文本内容，请先复制Word/TXT内容', 'error');
                        if (window.setPasteHandlerActive) {
                            window.setPasteHandlerActive(true);
                        }
                    }
                }).catch(err => {
                    console.error('读取剪贴板失败:', err);
                    // 降级方案：提示用户手动粘贴
                    showMessage('请使用 Ctrl+V (或 Cmd+V) 粘贴Word/TXT内容', 'info');
                    setupPasteHandler();
                });
            } else {
                // 降级方案：使用传统方式
                showMessage('请使用 Ctrl+V (或 Cmd+V) 粘贴Word/TXT内容', 'info');
                setupPasteHandler();
            }
        }
        
        // 设置粘贴事件处理器（降级方案）
        function setupPasteHandler() {
            const editor = document.getElementById('content');
            let pasteHandled = false;
            
            // 临时禁用默认粘贴处理器
            if (window.setPasteHandlerActive) {
                window.setPasteHandlerActive(false);
            }
            
            // 创建一个临时的paste事件监听器
            const pasteHandler = function(e) {
                if (pasteHandled) {
                    return; // 防止重复处理
                }
                pasteHandled = true;
                
                e.preventDefault();
                e.stopPropagation();
                
                const clipboardData = e.clipboardData || window.clipboardData;
                
                // 只获取纯文本
                const text = clipboardData.getData('text/plain');
                if (text) {
                    processPlainTextPaste(text);
                }
                
                // 重新启用默认粘贴处理器
                setTimeout(() => {
                    if (window.setPasteHandlerActive) {
                        window.setPasteHandlerActive(true);
                    }
                    editor.removeEventListener('paste', pasteHandler);
                    pasteHandled = false;
                }, 500);
            };
            
            // 添加临时监听器（只触发一次）
            editor.addEventListener('paste', pasteHandler, { once: true });
        }
        
        // 处理纯文本粘贴内容
        function processPlainTextPaste(text) {
            // 将文本按行分割，智能处理段落
            const lines = text.split(/\r?\n/);
            let html = '';
            let currentParagraph = '';
            let emptyLineCount = 0;
            
            lines.forEach((line, index) => {
                const trimmedLine = line.trim();
                
                if (trimmedLine) {
                    // 有内容的行
                    // 如果之前有空行，先结束当前段落
                    if (emptyLineCount > 0 && currentParagraph) {
                        html += '<p>' + escapeHtml(currentParagraph.trim()) + '</p>';
                        currentParagraph = '';
                        // 如果有多个空行，添加一个空段落作为间距
                        if (emptyLineCount > 1) {
                            html += '<p><br></p>';
                        }
                        emptyLineCount = 0;
                    }
                    
                    // 处理列表项（以●、•、-、*等开头的行）
                    if (/^[●•\-\*]\s/.test(trimmedLine)) {
                        // 如果当前段落有内容，先结束它
                        if (currentParagraph) {
                            html += '<p>' + escapeHtml(currentParagraph.trim()) + '</p>';
                            currentParagraph = '';
                        }
                        // 列表项单独成段
                        html += '<p>' + escapeHtml(trimmedLine) + '</p>';
                    } else {
                        // 普通文本，添加到当前段落
                        if (currentParagraph) {
                            currentParagraph += ' ' + trimmedLine;
                        } else {
                            currentParagraph = trimmedLine;
                        }
                    }
                } else {
                    // 空行
                    emptyLineCount++;
                    // 如果当前段落有内容，结束它
                    if (currentParagraph) {
                        html += '<p>' + escapeHtml(currentParagraph.trim()) + '</p>';
                        currentParagraph = '';
                    }
                }
            });
            
            // 处理最后一段
            if (currentParagraph) {
                html += '<p>' + escapeHtml(currentParagraph.trim()) + '</p>';
            }
            
            // 如果没有生成任何内容，至少保留原始文本
            if (!html) {
                html = '<p>' + escapeHtml(text.trim()) + '</p>';
            }
            
            // 清理多余的空段落
            html = html
                .replace(/(<p><br><\/p>\s*){2,}/gi, '<p><br></p>') // 合并多个空段落
                .replace(/^(<p><br><\/p>\s*)+/gi, '') // 删除开头的空段落
                .replace(/(<p><br><\/p>\s*)+$/gi, ''); // 删除结尾的空段落
            
            // 插入清理后的内容
            insertHTML(html);
        }
        
        // HTML转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function saveDraft() {
            submitAnnouncement('draft');
        }
        
        function submitAnnouncement(status) {
            if (isUploading) {
                showMessage('文件正在上传中，请稍候...', 'error');
                return;
            }
            
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').innerHTML.trim();
            const boardId = document.getElementById('board_id').value;
            const subBoardId = document.getElementById('sub_board_id').value || null;
            const priority = document.getElementById('priority').value;
            
            // 验证必填字段
            if (!title || !content || !boardId) {
                showMessage('请填写所有必填字段', 'error');
                return;
            }
            
            // 检查内容是否为空
            const textContent = document.getElementById('content').textContent.trim();
            if (!textContent) {
                showMessage('公告内容不能为空', 'error');
                return;
            }
            
            // 禁用按钮
            const saveBtn = document.getElementById('save-btn');
            const submitBtn = document.getElementById('submit-btn');
            saveBtn.disabled = true;
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            
            // 显示提交进度条
            showSubmitProgress(0, '准备提交公告...');
            
            // 如果有附件，先验证附件是否都已准备好
            if (attachments.length > 0) {
                updateSubmitProgress(20, '验证附件...');
                // 检查附件数据完整性
                let hasError = false;
                for (let i = 0; i < attachments.length; i++) {
                    if (!attachments[i].data || attachments[i].data.length === 0) {
                        hasError = true;
                        break;
                    }
                }
                if (hasError) {
                    hideSubmitProgress();
                    saveBtn.disabled = false;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 提交审核';
                    showMessage('附件数据不完整，请重新选择文件', 'error');
                    return;
                }
                updateSubmitProgress(30, `已确认 ${attachments.length} 个附件准备就绪`);
            } else {
                updateSubmitProgress(30, '无附件，继续提交...');
            }
            
            // 获取选择的审批人
            const approverSelect = document.getElementById('approver');
            const selectedApprover = approverSelect ? approverSelect.value : '';
            
            // 如果状态为pending且未选择审批人，提示用户
            if (status === 'pending' && !selectedApprover) {
                hideSubmitProgress();
                saveBtn.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 提交审核';
                showMessage('请选择审批人', 'error');
                return;
            }
            
            const announcementData = {
                title: title,
                content: content,
                board_id: boardId,
                sub_board_id: subBoardId,
                priority: priority,
                status: status,
                attachments: attachments,
                approver: selectedApprover || null  // 审批人userid（可选）
            };
            
            updateSubmitProgress(40, '正在上传数据到服务器...');
            hideSubmitProgress();

            TransferUtils.xhrUpload('/api/announcement/create', announcementData, {
                title: status === 'draft' ? '正在保存草稿' : '正在提交审核',
                status: '正在上传数据到服务器...'
            })
            .then(result => {
                saveBtn.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 提交审核';

                if (result.success) {
                    const action = status === 'draft' ? '保存草稿' : '提交审核';
                    const attachmentInfo = attachments.length > 0 ? `，已成功上传 ${attachments.length} 个附件` : '';
                    let successMsg = `${action}成功！${attachmentInfo}${status === 'pending' ? '等待管理员审核。' : ''}`;
                    if (status === 'pending' && result.approval_notification_sent === true) {
                        successMsg += ' 已向审批人发送工作通知。';
                    }
                    showMessage(successMsg, 'success');
                    if (status === 'pending' && result.approval_notification_error) {
                        showMessage('【审批通知】' + result.approval_notification_error, 'error');
                    }

                    if (status === 'pending') {
                        setTimeout(() => { window.location.href = '/announcement'; }, 2000);
                    }
                } else {
                    showMessage(result.error || result.message || '操作失败', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                saveBtn.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 提交审核';
                showMessage(error.message || '网络错误，请稍后重试', 'error');
            });
        }
        
        function showSubmitProgress(percentage, status) {
            const progressDiv = document.getElementById('submit-progress');
            const progressBar = document.getElementById('submit-progress-bar');
            const statusDiv = document.getElementById('submit-status');
            
            progressDiv.style.display = 'block';
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
            statusDiv.textContent = status;
            statusDiv.className = 'submit-status submitting';
        }
        
        function updateSubmitProgress(percentage, status) {
            const progressBar = document.getElementById('submit-progress-bar');
            const statusDiv = document.getElementById('submit-status');
            
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
            statusDiv.textContent = status;
            
            if (percentage === 100) {
                statusDiv.className = 'submit-status success';
            }
        }
        
        function hideSubmitProgress() {
            setTimeout(() => {
                const progressDiv = document.getElementById('submit-progress');
                progressDiv.style.display = 'none';
            }, 2000);
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // 自动隐藏成功消息
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
        // 页面加载完成后初始化预览功能
        document.addEventListener('DOMContentLoaded', function() {
            initPreview();
        });
        
        // 如果DOM已经加载完成，直接初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPreview);
        } else {
            initPreview();
        }
    </script>
