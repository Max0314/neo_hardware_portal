<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级公告栏管理 - 硬件研发部管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a252f, #2c3e50);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(26, 37, 47, 0.8);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        .header h1 {
            color: #3498db;
            font-size: 2rem;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #34495e;
        }
        .btn-back:hover {
            background: #2c3e50;
        }
        .btn-success {
            background: #27ae60;
        }
        .btn-success:hover {
            background: #219653;
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .board-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .board-item {
            background: rgba(52, 73, 94, 0.6);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #34495e;
        }
        .board-item h3 {
            color: #3498db;
            margin-bottom: 10px;
        }
        .board-item p {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .board-actions {
            display: flex;
            gap: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
        }
        .info-box {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid #3498db;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        .info-box strong {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/announcement" class="btn btn-back">← 返回公告栏</a>
            <h1>一级公告栏管理</h1>
            <div></div>
        </div>

        <div class="info-box">
            <strong>提示：</strong>一级公告栏（子公告栏）通过配置文件管理。如需添加、修改或删除一级公告栏，请联系系统管理员修改配置文件。
        </div>

        <div id="board-list" class="board-list">
            <!-- 公告栏列表将在这里动态加载 -->
        </div>
    </div>

    <!-- 消息提示容器 -->
    <div id="messageContainer" style="position: fixed; top: 20px; right: 20px; z-index: 1001;"></div>

    <script>
        // 显示消息提示
        function showMessage(msg, type = 'info') {
            const messageContainer = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                padding: 15px 20px;
                border-radius: 5px;
                margin-bottom: 10px;
                font-weight: bold;
                color: white;
                min-width: 200px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                animation: slideIn 0.3s ease-out;
            `;
            
            if (type === 'success') {
                messageDiv.style.backgroundColor = '#27ae60';
            } else if (type === 'error') {
                messageDiv.style.backgroundColor = '#e74c3c';
            } else {
                messageDiv.style.backgroundColor = '#3498db';
            }
            
            messageDiv.textContent = msg;
            messageContainer.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => messageDiv.remove(), 300);
            }, 3000);
        }

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 加载所有一级公告栏
        async function loadBoards() {
            try {
                const response = await fetch('/api/announcement/boards');
                if (!response.ok) {
                    if (response.status === 302 || response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const boards = await response.json();
                renderBoards(boards);
            } catch (error) {
                console.error('加载一级公告栏失败:', error);
                showMessage('加载失败: ' + error.message, 'error');
                document.getElementById('board-list').innerHTML = 
                    '<div class="empty-state">加载失败，请刷新页面重试</div>';
            }
        }

        // 渲染一级公告栏列表
        function renderBoards(boards) {
            const container = document.getElementById('board-list');
            container.innerHTML = '';

            if (boards.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无一级公告栏</div>';
                return;
            }

            boards.forEach(board => {
                const item = document.createElement('div');
                item.className = 'board-item';
                item.innerHTML = `
                    <h3>${board.name}</h3>
                    <p><strong>ID:</strong> ${board.id}</p>
                    <p>${board.description || ''}</p>
                    <div class="board-actions">
                        <button class="btn" onclick="viewBoardDetails('${board.id}')">查看详情</button>
                        <a href="/sub-board-management?parent=${board.id}" class="btn btn-success">管理二级公告栏</a>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 查看公告栏详情
        function viewBoardDetails(boardId) {
            // 可以跳转到该公告栏的公告列表
            window.location.href = `/announcement?board=${boardId}`;
        }

        // 页面加载时
        document.addEventListener('DOMContentLoaded', function() {
            loadBoards();
        });
    </script>
</body>
</html>
