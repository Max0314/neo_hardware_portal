<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告栏管理 - 硬件研发部管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/neo-systm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a252f, #2c3e50);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(26, 37, 47, 0.8);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        .header h1 {
            color: #3498db;
            font-size: 2rem;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #34495e;
        }
        .btn-back:hover {
            background: #2c3e50;
        }
        .btn-success {
            background: #27ae60;
        }
        .btn-success:hover {
            background: #219653;
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #34495e;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #95a5a6;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .board-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .board-item {
            background: rgba(52, 73, 94, 0.6);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #34495e;
        }
        .board-item h3 {
            color: #3498db;
            margin-bottom: 10px;
        }
        .board-item p {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .board-actions {
            display: flex;
            gap: 10px;
        }
        .board-section {
            margin-bottom: 30px;
        }
        .board-title {
            color: #3498db;
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sub-board-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .sub-board-item {
            background: rgba(52, 73, 94, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #34495e;
        }
        .sub-board-item h3 {
            color: #3498db;
            margin-bottom: 10px;
        }
        .sub-board-item p {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .sub-board-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .modal-content h2 {
            color: #3498db;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #ecf0f1;
            margin-bottom: 8px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(52, 73, 94, 0.6);
            border: 2px solid #34495e;
            border-radius: 5px;
            color: #ecf0f1;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
        }
        .info-box {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid #3498db;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        .info-box strong {
            color: #3498db;
        }
    </style>
</head>
<body class="neo-systm-home">
    <div class="container neo-page-wrap">
        <div class="neo-page-header">
            <div class="header-brand-column neo-header-brand-inline">
                <img src="logo.png" alt="CHANGHONG NeoNet" class="brand-logo-top-index" />
                <div class="header-brand-main">
                    <div class="header-title" style="margin:0;">
                        <div class="logo-text-index">NEO Hardware <span>AI</span></div>
                        <div class="sys-subtitle-index">硬件研发部管理系统</div>
                    </div>
                </div>
            </div>
            <div class="neo-header-actions">
                <span class="neo-page-title">公告栏管理</span>
                <button class="neo-btn neo-btn-success" id="createPrimaryBoardBtn" onclick="openCreatePrimaryBoardModal()" style="display: none;">+ 创建一级公告栏</button>
                <button class="neo-btn neo-btn-success" onclick="openCreateSubBoardModal()">+ 创建二级公告栏</button>
                <a href="announcement" class="neo-btn neo-btn-secondary">← 返回公告栏</a>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="primary">一级公告栏</div>
            <div class="tab" data-tab="secondary">二级公告栏</div>
        </div>

        <!-- 一级公告栏 -->
        <div class="tab-content active" id="primaryBoards">
            <div id="primary-board-list" class="board-list"></div>
        </div>

        <!-- 二级公告栏 -->
        <div class="tab-content" id="secondaryBoards">
            <div id="secondary-board-list"></div>
        </div>
    </div>

    <!-- 创建/编辑一级公告栏模态框 -->
    <div id="primary-board-modal" class="modal">
        <div class="modal-content">
            <h2 id="primary-modal-title">创建一级公告栏</h2>
            <form id="primary-board-form">
                <input type="hidden" id="primary-form-action" name="action" value="create">
                <div class="form-group">
                    <label for="primary-board-id">公告栏ID *</label>
                    <input type="text" id="primary-board-id" name="board_id" required 
                           placeholder="例如: hardware_v2" pattern="[a-z0-9_]+">
                    <small style="color: #95a5a6;">只能包含小写字母、数字和下划线，不能使用 'all'</small>
                </div>
                <div class="form-group">
                    <label for="primary-board-name">公告栏名称 *</label>
                    <input type="text" id="primary-board-name" name="name" required 
                           placeholder="例如: 硬件研发部2.0">
                </div>
                <div class="form-group">
                    <label for="primary-board-desc">描述</label>
                    <textarea id="primary-board-desc" name="description" rows="3" 
                              placeholder="可选"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closePrimaryBoardModal()">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 创建/编辑二级公告栏模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">创建二级公告栏</h2>
            <form id="sub-board-form">
                <input type="hidden" id="form-action" name="action" value="create">
                <div class="form-group">
                    <label for="parent-board">父公告栏 *</label>
                    <select id="parent-board" name="parent_board_id" required>
                        <option value="">请选择父公告栏</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sub-board-id">二级公告栏ID</label>
                    <input type="text" id="sub-board-id" name="sub_board_id" 
                           placeholder="留空将自动生成（基于名称）" pattern="[a-z0-9_]+">
                    <small style="color: #95a5a6;">留空将自动生成，或手动输入（只能包含小写字母、数字和下划线）</small>
                </div>
                <div class="form-group">
                    <label for="sub-board-name">二级公告栏名称 *</label>
                    <input type="text" id="sub-board-name" name="name" required 
                           placeholder="例如: 原理图公告">
                </div>
                <div class="form-group">
                    <label for="sub-board-desc">描述</label>
                    <textarea id="sub-board-desc" name="description" rows="3" 
                              placeholder="可选"></textarea>
                </div>
                <div class="form-group">
                    <label for="display-order">显示顺序</label>
                    <input type="number" id="display-order" name="display_order" value="0" min="0">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 消息提示容器 -->
    <div id="messageContainer" style="position: fixed; top: 20px; right: 20px; z-index: 1001;"></div>

    <script>
        const APP_PATH_PREFIX = (function () {
            const marker = '/neo_hardware_portal';
            const path = window.location.pathname || '/';
            if (path === marker || path.indexOf(marker + '/') === 0) {
                return marker;
            }
            return '';
        })();

        function appPath(path) {
            path = String(path || '/');
            if (/^[a-z][a-z0-9+.-]*:/i.test(path) || path.indexOf('//') === 0) {
                return path;
            }
            if (APP_PATH_PREFIX && (path === APP_PATH_PREFIX || path.indexOf(APP_PATH_PREFIX + '/') === 0)) {
                return path;
            }
            if (path.charAt(0) !== '/') {
                path = '/' + path;
            }
            return APP_PATH_PREFIX + path;
        }

        const ANNOUNCEMENT_BOARDS = {
            'hardware': '硬件研发部',
            'circuit': '电路设计组',
            'structure': '结构组',
            'packaging': '包装标签组',
            'testing': '测试组'
        };
        
        let allSubBoards = {};
        let editingSubBoard = null;
        let editingPrimaryBoard = null;
        let allPrimaryBoards = [];

        // 显示消息提示
        function showMessage(msg, type = 'info') {
            const messageContainer = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                padding: 15px 20px;
                border-radius: 5px;
                margin-bottom: 10px;
                font-weight: bold;
                color: white;
                min-width: 200px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                animation: slideIn 0.3s ease-out;
            `;
            
            if (type === 'success') {
                messageDiv.style.backgroundColor = '#27ae60';
            } else if (type === 'error') {
                messageDiv.style.backgroundColor = '#e74c3c';
            } else {
                messageDiv.style.backgroundColor = '#3498db';
            }
            
            messageDiv.textContent = msg;
            messageContainer.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => messageDiv.remove(), 300);
            }, 3000);
        }

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 标签页切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                const tabName = this.dataset.tab;
                if (tabName === 'primary') {
                    document.getElementById('primaryBoards').classList.add('active');
                    loadPrimaryBoards();
                } else {
                    document.getElementById('secondaryBoards').classList.add('active');
                    loadAllSubBoards();
                }
            });
        });

        // 加载一级公告栏
        async function loadPrimaryBoards() {
            try {
                const response = await fetch(appPath('/api/announcement/boards'));
                if (!response.ok) {
                    if (response.status === 302 || response.status === 401) {
                        window.location.href = appPath('/login');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const boards = await response.json();
                allPrimaryBoards = boards;
                renderPrimaryBoards(boards);
                // 更新父公告栏选择器
                updateParentBoardSelector();
            } catch (error) {
                console.error('加载一级公告栏失败:', error);
                showMessage('加载失败: ' + error.message, 'error');
                document.getElementById('primary-board-list').innerHTML = 
                    '<div class="empty-state">加载失败，请刷新页面重试</div>';
            }
        }
        
        // 更新父公告栏选择器
        function updateParentBoardSelector() {
            const parentSelect = document.getElementById('parent-board');
            if (!parentSelect) return;
            
            parentSelect.innerHTML = '<option value="">请选择父公告栏</option>';
            allPrimaryBoards.forEach(board => {
                const option = document.createElement('option');
                option.value = board.id;
                option.textContent = board.name;
                parentSelect.appendChild(option);
            });
        }

        // 渲染一级公告栏列表
        function renderPrimaryBoards(boards) {
            const container = document.getElementById('primary-board-list');
            container.innerHTML = '';

            if (boards.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无一级公告栏</div>';
                return;
            }

            // 检查权限
            const canManageBoards = checkCanManageBoards();

            boards.forEach(board => {
                const item = document.createElement('div');
                item.className = 'board-item';
                const safeName = (board.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const editBtn = canManageBoards ? `<button class="btn btn-small" onclick="editPrimaryBoard('${board.id}')">编辑</button>` : '';
                const deleteBtn = canManageBoards ? `<button class="btn btn-danger btn-small" onclick="deletePrimaryBoard('${board.id}', '${safeName}')">删除</button>` : '';
                
                item.innerHTML = `
                    <h3>${board.name}</h3>
                    <p><strong>ID:</strong> ${board.id}</p>
                    <p>${board.description || ''}</p>
                    <div class="board-actions">
                        <button class="btn btn-small" onclick="viewBoardDetails('${board.id}')">查看详情</button>
                        ${editBtn}
                        ${deleteBtn}
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        // 检查是否可以管理公告栏（只有最高管理员）
        function checkCanManageBoards() {
            try {
                const user = JSON.parse(sessionStorage.getItem('user') || '{}');
                const roles = user.roles || [];
                const username = (user.username || '').toLowerCase();
                return username === 'zzw'
                    || roles.includes('super_admin')
                    || roles.includes('admin')
                    || roles.includes('management');
            } catch (e) {
                return false;
            }
        }
        
        // 编辑一级公告栏
        function editPrimaryBoard(boardId) {
            // 获取当前公告栏信息
            fetch(appPath('/api/announcement/boards'))
                .then(response => response.json())
                .then(boards => {
                    const board = boards.find(b => b.id === boardId);
                    if (!board) {
                        showMessage('找不到该公告栏', 'error');
                        return;
                    }
                    
                    editingPrimaryBoard = boardId;
                    document.getElementById('primary-form-action').value = 'update';
                    document.getElementById('primary-modal-title').textContent = '编辑一级公告栏';
                    document.getElementById('primary-board-id').value = board.id;
                    document.getElementById('primary-board-name').value = board.name;
                    document.getElementById('primary-board-desc').value = board.description || '';
                    document.getElementById('primary-board-id').disabled = true; // 编辑时不允许修改ID
                    
                    document.getElementById('primary-board-modal').classList.add('active');
                })
                .catch(error => {
                    console.error('加载公告栏信息失败:', error);
                    showMessage('加载失败: ' + error.message, 'error');
                });
        }
        
        // 删除一级公告栏
        async function deletePrimaryBoard(boardId, boardName) {
            if (!confirm(`确定要删除一级公告栏 "${boardName}" 吗？\n\n注意：删除前请确保该公告栏下没有公告和二级公告栏。\n此操作不可恢复！`)) {
                return;
            }
            
            // 显示进度条
            const progressModal = document.createElement('div');
            progressModal.id = 'delete-progress-modal';
            progressModal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
            `;
            progressModal.innerHTML = `
                <div style="
                    background: white;
                    padding: 30px;
                    border-radius: 10px;
                    text-align: center;
                    min-width: 300px;
                ">
                    <div style="
                        width: 50px;
                        height: 50px;
                        border: 4px solid #f3f3f3;
                        border-top: 4px solid #3498db;
                        border-radius: 50%;
                        animation: spin 1s linear infinite;
                        margin: 0 auto 20px;
                    "></div>
                    <p style="font-size: 16px; color: #333; margin: 0;">正在删除一级公告栏...</p>
                    <p style="font-size: 14px; color: #666; margin: 10px 0 0 0;">请稍候，操作可能需要几秒钟</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;
            document.body.appendChild(progressModal);
            
            try {
                const startTime = Date.now();
                console.log(`[deletePrimaryBoard] 开始删除: boardId=${boardId}`);
                
                // 设置超时（30秒）
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('删除操作超时，请刷新页面检查状态')), 30000);
                });
                
                const fetchPromise = fetch(appPath('/api/announcement/boards/manage'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'delete',
                        board_id: boardId
                    })
                });
                
                const response = await Promise.race([fetchPromise, timeoutPromise]);
                
                const elapsed = Date.now() - startTime;
                console.log(`[deletePrimaryBoard] 删除请求完成，耗时: ${elapsed}ms`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`[deletePrimaryBoard] 服务器错误: ${response.status} ${errorText}`);
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log(`[deletePrimaryBoard] 删除结果:`, result);
                
                // 移除进度条
                progressModal.remove();
                
                // 无论成功或失败，都更新数据（后端总是返回 updated_boards）
                if (result.updated_boards) {
                    console.log(`[deletePrimaryBoard] 使用后端返回的更新列表: ${result.updated_boards.length} 个公告栏`);
                    allPrimaryBoards = result.updated_boards;
                    renderPrimaryBoards(allPrimaryBoards);
                    // 更新父公告栏选择器
                    updateParentBoardSelector();
                } else {
                    console.log(`[deletePrimaryBoard] 后端未返回列表，重新加载数据`);
                    await loadPrimaryBoards();
                }
                
                // 重新加载二级公告栏数据
                await loadAllSubBoards();
                
                if (result.success) {
                    showMessage('删除成功: ' + (result.message || '一级公告栏已删除'), 'success');
                    console.log(`[deletePrimaryBoard] 删除成功，数据已刷新`);
                } else {
                    showMessage(result.message || result.error || '删除失败', 'error');
                    console.log(`[deletePrimaryBoard] 删除失败，但数据已刷新`);
                }
            } catch (error) {
                console.error('删除一级公告栏失败:', error);
                progressModal.remove();
                showMessage('删除失败: ' + error.message, 'error');
            }
        }
        
        // 打开创建一级公告栏模态框
        function openCreatePrimaryBoardModal() {
            editingPrimaryBoard = null;
            document.getElementById('primary-form-action').value = 'create';
            document.getElementById('primary-modal-title').textContent = '创建一级公告栏';
            document.getElementById('primary-board-form').reset();
            document.getElementById('primary-board-id').disabled = false;
            document.getElementById('primary-board-modal').classList.add('active');
        }

        // 查看公告栏详情（显示公告列表，支持编辑和删除）
        async function viewBoardDetails(boardId) {
            try {
                const response = await fetch(appPath(`/api/announcement/list?board=${boardId}`));
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const result = await response.json();
                
                // 兼容新旧API格式：新格式有分页信息，旧格式直接是数组
                let announcements;
                if (result && result.announcements && Array.isArray(result.announcements)) {
                    // 新格式：包含分页信息
                    announcements = result.announcements;
                } else if (Array.isArray(result)) {
                    // 旧格式：直接是数组（向后兼容）
                    announcements = result;
                } else {
                    console.error('未知的API响应格式:', result);
                    announcements = [];
                }
                
                // 创建模态框显示公告列表
                showAnnouncementsModal(boardId, announcements);
            } catch (error) {
                console.error('加载公告失败:', error);
                showMessage('加载公告失败: ' + error.message, 'error');
            }
        }
        
        // 显示公告列表模态框
        function showAnnouncementsModal(boardId, announcements) {
            const boardName = ANNOUNCEMENT_BOARDS[boardId] || boardId;
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.id = 'announcements-modal';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 900px; max-height: 80vh; overflow-y: auto;">
                    <h2>${boardName} - 公告列表</h2>
                    <div style="margin-bottom: 20px;">
                        <button class="btn btn-success" onclick="createNewAnnouncement('${boardId}')">+ 新建公告</button>
                        <button class="btn" onclick="closeAnnouncementsModal()" style="margin-left: 10px;">关闭</button>
                    </div>
                    <div id="announcements-list-container">
                        ${renderAnnouncementsList(announcements)}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        // 渲染公告列表
        function renderAnnouncementsList(announcements) {
            if (!announcements || announcements.length === 0) {
                return '<div class="empty-state">该公告栏下暂无公告</div>';
            }
            
            return announcements.map(ann => {
                const statusText = {
                    'draft': '草稿',
                    'pending': '待审核',
                    'approved': '已发布',
                    'rejected': '已拒绝'
                }[ann.status] || ann.status;
                
                const statusColor = {
                    'draft': '#95a5a6',
                    'pending': '#f39c12',
                    'approved': '#27ae60',
                    'rejected': '#e74c3c'
                }[ann.status] || '#95a5a6';
                
                return `
                    <div class="board-item" style="margin-bottom: 15px;">
                        <h3>${ann.title || '无标题'}</h3>
                        <p><strong>状态:</strong> <span style="color: ${statusColor};">${statusText}</span></p>
                        <p><strong>作者:</strong> ${ann.author || '未知'}</p>
                        <p><strong>创建时间:</strong> ${ann.create_time || '未知'}</p>
                        ${ann.sub_board_name ? `<p><strong>二级公告栏:</strong> ${ann.sub_board_name}</p>` : ''}
                        <div class="board-actions" style="margin-top: 10px;">
                            <button class="btn btn-small" onclick="editAnnouncement('${ann.id}')">编辑</button>
                            <button class="btn btn-danger btn-small" onclick="deleteAnnouncement('${ann.id}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');

        // 关闭公告列表模态框
        function closeAnnouncementsModal() {
            const modal = document.getElementById('announcements-modal');
            if (modal) {
                modal.remove();
            }
        }
        
        // 编辑公告
        function editAnnouncement(announcementId) {
            window.location.href = appPath(`/announcement-editor?id=${announcementId}`);
        }
        
        // 删除公告
        async function deleteAnnouncement(announcementId) {
            if (!confirm('确定要删除这条公告吗？此操作不可恢复！')) {
                return;
            }
            
            try {
                const response = await fetch(appPath(`/api/announcement/delete/${announcementId}`), {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('删除成功', 'success');
                    // 重新加载当前公告栏的公告列表
                    const modalTitle = document.querySelector('#announcements-modal h2');
                    if (modalTitle) {
                        const titleText = modalTitle.textContent;
                        const boardName = titleText.split(' - ')[0];
                        // 从所有一级公告栏中查找
                        const board = allPrimaryBoards.find(b => b.name === boardName);
                        if (board) {
                            viewBoardDetails(board.id);
                        } else {
                            // 如果找不到，尝试从ANNOUNCEMENT_BOARDS查找
                            const boardIdKey = Object.keys(ANNOUNCEMENT_BOARDS).find(
                                key => ANNOUNCEMENT_BOARDS[key] === boardName
                            );
                            if (boardIdKey) {
                                viewBoardDetails(boardIdKey);
                            }
                        }
                    }
                } else {
                    showMessage(result.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除公告失败:', error);
                showMessage('删除失败: ' + error.message, 'error');
            }
        }

            window.location.href = appPath(`/announcement-editor?board=${boardId}`);
        }

        // 加载所有二级公告栏
        async function loadAllSubBoards() {
            try {
                // 确保一级公告栏已加载
                if (allPrimaryBoards.length === 0) {
                    await loadPrimaryBoards();
                }
                
                console.log('开始加载二级公告栏...');
                const response = await fetch(appPath('/api/announcement/sub-boards/all'));
                if (!response.ok) {
                    if (response.status === 302 || response.status === 401) {
                        window.location.href = appPath('/login');
                        return;
                    }
                    const errorText = await response.text();
                    console.error('API错误响应:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                console.log('加载的二级公告栏数据:', JSON.stringify(data, null, 2));

        // 渲染所有二级公告栏
        function renderAllSubBoards(subBoardsData) {
            const container = document.getElementById('secondary-board-list');
            container.innerHTML = '';

            console.log('开始渲染二级公告栏，数据:', subBoardsData);
            console.log('一级公告栏列表:', allPrimaryBoards);

            // 检查权限
            const canManageBoards = checkCanManageBoards();
            
            // 如果没有一级公告栏，显示提示

                container.innerHTML = '<div class="empty-state">暂无一级公告栏，请先创建一级公告栏</div>';
                return;
            }

            // 显示所有一级公告栏，即使没有二级公告栏也显示
            let hasAnySubBoards = false;
            
            // 调试：打印所有可用的parent_id
            console.log('二级公告栏数据的所有键:', Object.keys(subBoardsData));
            console.log('一级公告栏的所有ID:', allPrimaryBoards.map(b => b.id));
            console.log('二级公告栏数据详情:', subBoardsData);
            
            // 创建一个映射，用于匹配一级公告栏ID和二级公告栏的parent_board_id
            // 因为可能存在大小写或格式差异
            const parentIdMap = {};
            Object.keys(subBoardsData).forEach(key => {
                parentIdMap[key.toLowerCase()] = key; // 创建小写映射
                parentIdMap[key] = key; // 直接映射
            });
            
            allPrimaryBoards.forEach(primaryBoard => {
                const parentId = primaryBoard.id;
                const parentName = primaryBoard.name;
                
                // 尝试多种方式匹配
                let subBoards = subBoardsData[parentId];
                
                // 如果直接匹配失败，尝试小写匹配
                if (!subBoards && parentIdMap[parentId.toLowerCase()]) {
                    const matchedKey = parentIdMap[parentId.toLowerCase()];
                    subBoards = subBoardsData[matchedKey];
                    console.log(`  使用小写匹配: ${parentId} -> ${matchedKey}`);
                }
                
                // 如果还是找不到，尝试在所有键中查找（包含匹配）
                if (!subBoards) {
                    for (const key in subBoardsData) {
                        if (key.toLowerCase() === parentId.toLowerCase() || 
                            key === parentId || 
                            parentId.toLowerCase().includes(key.toLowerCase()) ||
                            key.toLowerCase().includes(parentId.toLowerCase())) {
                            subBoards = subBoardsData[key];
                            console.log(`  使用模糊匹配: ${parentId} -> ${key}`);
                            break;
                        }
                    }
                }
                
                console.log(`处理一级公告栏 ${parentId} (${parentName}):`, subBoards);
                console.log(`  查找键 "${parentId}" 在数据中:`, parentId in subBoardsData);
                console.log(`  找到的二级公告栏数量:`, subBoards ? (Array.isArray(subBoards) ? subBoards.length : '不是数组') : '未找到');
                
                // 如果subBoards是undefined或null，使用空数组
                const subBoardsArray = Array.isArray(subBoards) ? subBoards : [];
                if (subBoardsArray.length > 0) {
                    hasAnySubBoards = true;
                }
                
                const section = document.createElement('div');
                section.className = 'board-section';
                const createBtn = canManageBoards ? `<button class="btn btn-success btn-small" onclick="openCreateSubBoardModal('${parentId}')">+ 添加二级公告栏</button>` : '';
                section.innerHTML = `
                    <div class="board-title">
                        <span>${parentName}</span>
                        ${createBtn}
                    </div>
                    <div class="sub-board-list" id="sub-boards-${parentId}"></div>
                `;
                container.appendChild(section);

                const subBoardList = document.getElementById(`sub-boards-${parentId}`);
                if (subBoardsArray.length === 0) {
                    subBoardList.innerHTML = '<div class="empty-state">该公告栏下暂无二级公告栏</div>';
                } else {
                    subBoardsArray.forEach(subBoard => {
                        const item = document.createElement('div');
                        item.className = 'sub-board-item';
                        const safeName = (subBoard.name || subBoard.sub_board_id || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        const editBtn = canManageBoards ? `<button class="btn btn-small" onclick="editSubBoard('${parentId}', '${subBoard.sub_board_id}')">编辑</button>` : '';
                        const deleteBtn = canManageBoards ? `<button class="btn btn-danger btn-small" onclick="deleteSubBoard('${parentId}', '${subBoard.sub_board_id}', '${safeName}')">删除</button>` : '';
                        
                        item.innerHTML = `
                            <h3>${subBoard.name || subBoard.sub_board_id}</h3>
                            <p><strong>ID:</strong> ${subBoard.sub_board_id}</p>
                            <p>${subBoard.description || ''}</p>
                            ${canManageBoards ? `<div class="sub-board-actions">${editBtn}${deleteBtn}</div>` : ''}
                        `;
                        subBoardList.appendChild(item);
                    });
                }
            });
            
            // 如果没有任何二级公告栏，显示提示
            if (!hasAnySubBoards && allPrimaryBoards.length > 0) {
                // 如果已经显示了所有一级公告栏，就不需要额外提示了
                // 因为每个一级公告栏下已经显示了"暂无二级公告栏"
            }
        }

        function openCreateSubBoardModal(parentId = null) {

        // 编辑二级公告栏
        function editSubBoard(parentId, subBoardId) {
            const subBoards = allSubBoards[parentId] || [];
            const subBoard = subBoards.find(sb => sb.sub_board_id === subBoardId);

            document.getElementById('modal-title').textContent = '编辑二级公告栏';

            const parentSelect = document.getElementById('parent-board');
            parentSelect.innerHTML = '<option value="">请选择父公告栏</option>';

                option.textContent = board.name;
                if (board.id === parentId) {

            document.getElementById('display-order').value = subBoard.display_order || 0;
            
            document.getElementById('modal').classList.add('active');

        // 删除二级公告栏
        async function deleteSubBoard(parentId, subBoardId, subBoardName) {
            const displayName = subBoardName || subBoardId;
            if (!confirm(`确定要删除二级公告栏 "${displayName}" 吗？\n\n此操作不可恢复！`)) {
                return;
            }
            
            // 显示进度条
            const progressModal = document.createElement('div');
            progressModal.id = 'delete-progress-modal';
            progressModal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
            `;
            progressModal.innerHTML = `
                <div style="
                    background: white;
                    padding: 30px;
                    border-radius: 10px;
                    text-align: center;
                    min-width: 300px;
                ">
                    <div style="
                        width: 50px;
                        height: 50px;
                        border: 4px solid #f3f3f3;
                        border-top: 4px solid #3498db;
                        border-radius: 50%;
                        animation: spin 1s linear infinite;
                        margin: 0 auto 20px;
                    "></div>
                    <p style="font-size: 16px; color: #333; margin: 0;">正在删除二级公告栏...</p>
                    <p style="font-size: 14px; color: #666; margin: 10px 0 0 0;">请稍候，操作可能需要几秒钟</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;
            document.body.appendChild(progressModal);
            
            try {
                const encodedParentId = encodeURIComponent(parentId);
                const encodedSubBoardId = encodeURIComponent(subBoardId);
                const startTime = Date.now();
                
                console.log(`[deleteSubBoard] 开始删除: parent=${parentId}, sub=${subBoardId}`);
                
                const response = await fetch(appPath(`/api/announcement/sub-boards/delete/${encodedParentId}/${encodedSubBoardId}`), {
                    method: 'DELETE'
                });
                
                const elapsed = Date.now() - startTime;
                console.log(`[deleteSubBoard] 删除请求完成，耗时: ${elapsed}ms`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log(`[deleteSubBoard] 删除结果:`, result);
                
                // 移除进度条
                progressModal.remove();
                
                if (result.success) {
                    showMessage('删除成功: ' + (result.message || '二级公告栏已删除'), 'success');
                    console.log(`[deleteSubBoard] 删除成功，重新加载数据...`);
                    
                    // 重新加载数据，确保显示最新状态
                    await loadAllSubBoards();
                    
                    // 验证删除是否真的完成
                    setTimeout(async () => {
                        try {
                            const verifyResponse = await fetch(appPath('/api/announcement/sub-boards/all'));
                            const verifyData = await verifyResponse.json();
                            const parentSubBoards = verifyData[parentId] || [];
                            const stillExists = parentSubBoards.some(sb => sb.sub_board_id === subBoardId);
                            
                            if (stillExists) {
                                console.warn(`[deleteSubBoard] 警告: 二级公告栏仍然存在，可能需要刷新页面`);
                                showMessage('删除可能未完全生效，请刷新页面', 'warning');
                            } else {
                                console.log(`[deleteSubBoard] 验证通过: 二级公告栏已成功删除`);
                            }
                        } catch (verifyError) {
                            console.error('[deleteSubBoard] 验证删除状态失败:', verifyError);
                        }
                    }, 500);
                } else {
                    showMessage(result.error || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除二级公告栏失败:', error);
                progressModal.remove();
                showMessage('删除失败: ' + error.message, 'error');
            }
        }

        // 一级公告栏表单提交
        document.getElementById('primary-board-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const action = document.getElementById('primary-form-action').value;
            const boardId = document.getElementById('primary-board-id').value.trim();
            const name = document.getElementById('primary-board-name').value.trim();
            const description = document.getElementById('primary-board-desc').value.trim();
            
            if (!boardId || !name) {
                showMessage('公告栏ID和名称不能为空', 'error');
                return;
            }
            
            if (boardId === 'all') {
                showMessage('不能使用 "all" 作为公告栏ID', 'error');
                return;
            }
            
            try {
                const startTime = Date.now();
                console.log(`[createPrimaryBoard] 开始创建一级公告栏: ${boardId}`);
                
                // 添加30秒超时保护
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('创建操作超时，请刷新页面检查状态')), 30000);
                });
                
                const fetchPromise = fetch(appPath('/api/announcement/boards/manage'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: action,
                        board_id: boardId,
                        name: name,
                        description: description
                    })
                });
                
                const response = await Promise.race([fetchPromise, timeoutPromise]);
                
                const elapsed = Date.now() - startTime;
                console.log(`[createPrimaryBoard] 创建请求完成，耗时: ${elapsed}ms`);
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const result = await response.json();
                
                // 无论成功或失败，都更新数据（后端总是返回 updated_boards）
                if (result.updated_boards) {
                    console.log(`[createPrimaryBoard] 使用后端返回的更新列表: ${result.updated_boards.length} 个公告栏`);
                    allPrimaryBoards = result.updated_boards;
                    renderPrimaryBoards(allPrimaryBoards);
                    // 更新父公告栏选择器
                    updateParentBoardSelector();
                } else {
                    console.log(`[createPrimaryBoard] 后端未返回列表，重新加载数据`);
                    await loadPrimaryBoards();
                }
                
                // 重新加载二级公告栏数据
                await loadAllSubBoards();
                
                if (result.success) {
                    showMessage(result.message || '操作成功', 'success');
                    closePrimaryBoardModal();
                    console.log(`[createPrimaryBoard] 创建成功，数据已刷新`);
                } else {
                    showMessage(result.message || result.error || '操作失败', 'error');
                    console.log(`[createPrimaryBoard] 创建失败，但数据已刷新`);
                }
            } catch (error) {
                console.error('提交失败:', error);
                showMessage('提交失败: ' + error.message, 'error');
            }
        });
        
        // 检查权限并显示创建按钮
        async function checkPermissions() {
            try {
                const response = await fetch(appPath('/api/auth/check'));
                const result = await response.json();
                
                if (result.authenticated && result.user) {
                    const roles = result.user.roles || [];
                    const username = (result.user.username || '').toLowerCase();
                    const canManageBoards = username === 'zzw'
                        || roles.includes('super_admin')
                        || roles.includes('admin')
                        || roles.includes('management');
                    
                    if (canManageBoards) {
                        const createBtn = document.getElementById('createPrimaryBoardBtn');
                        if (createBtn) {
                            createBtn.style.display = 'inline-block';
                        }
                    }
                }
            } catch (error) {
                console.error('检查权限失败:', error);
            }
        }
        
        // 页面加载时
        document.addEventListener('DOMContentLoaded', function() {
            loadPrimaryBoards();
            checkPermissions();
            
            // 如果默认显示二级公告栏标签页，也加载二级公告栏
            const secondaryTab = document.getElementById('secondaryBoards');
            if (secondaryTab && secondaryTab.classList.contains('active')) {
                loadAllSubBoards();
            }
        });
    </script>
</body>
</html>
