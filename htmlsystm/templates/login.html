<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 硬件研发部管理系统</title>
    <link rel="icon" href="static/neo-logo.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
        }
        .login-container {
            width: 100%;
            max-width: 430px;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            line-height: 1.3;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        .status-box {
            min-height: 54px;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: center;
            border: 1px solid #dbeafe;
            color: #1d4ed8;
            background: #eff6ff;
        }
        .status-box.error {
            border-color: #fecaca;
            color: #b91c1c;
            background: #fef2f2;
        }
        .status-box.success {
            border-color: #bbf7d0;
            color: #15803d;
            background: #f0fdf4;
        }
        .btn-login {
            width: 100%;
            min-height: 48px;
            padding: 14px 16px;
            border: 0;
            border-radius: 8px;
            background: #1677ff;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-login:hover {
            background: #0958d9;
        }
        .btn-login:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }
        .secondary {
            margin-top: 14px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.86rem;
            line-height: 1.7;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        #startupOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(44, 62, 80, 0.92);
            z-index: 20000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #ecf0f1;
        }
        #startupOverlay.active {
            display: flex;
        }
        .startup-box {
            width: min(420px, 90vw);
            border-radius: 12px;
            background: #fff;
            color: #2c3e50;
            padding: 28px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .startup-box h2 {
            margin: 0 0 8px;
            font-size: 1.25rem;
            color: #2980b9;
        }
        .startup-bar-wrap {
            height: 14px;
            background: #ecf0f1;
            border-radius: 7px;
            overflow: hidden;
            margin: 16px 0 10px;
        }
        #startupBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.35s ease;
        }
        #startupMessage {
            min-height: 1.4em;
            color: #7f8c8d;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="startupOverlay" aria-live="polite">
        <div class="startup-box">
            <h2>系统正在启动</h2>
            <p style="margin:0;font-size:0.9rem;color:#95a5a6;">正在完成更新与健康检查，完成后方可登录</p>
            <div class="startup-bar-wrap"><div id="startupBar"></div></div>
            <div id="startupMessage">正在连接服务...</div>
        </div>
    </div>

    <main class="login-container">
        <div class="login-header">
            <h1>硬件研发部管理系统</h1>
            <p>请使用钉钉完成身份认证</p>
        </div>

        <div class="status-box" id="statusBox">正在检查登录状态...</div>

        <button type="button" class="btn-login" id="dingtalkLoginBtn">钉钉登录</button>
        <div class="secondary" id="loginHint">钉钉内打开将自动免登；浏览器访问请点击按钮授权登录。</div>

        <div class="footer">
            © 2024 硬件研发部管理系统
        </div>
    </main>

    <script>
        (function() {
            var authConfig = null;
            var authInProgress = false;
            var statusBox = document.getElementById('statusBox');
            var loginBtn = document.getElementById('dingtalkLoginBtn');
            var loginHint = document.getElementById('loginHint');

            function setStatus(message, tone) {
                statusBox.textContent = message || '';
                statusBox.className = 'status-box' + (tone ? ' ' + tone : '');
            }

            function setButtonBusy(busy, text) {
                authInProgress = !!busy;
                loginBtn.disabled = !!busy;
                loginBtn.textContent = text || (busy ? '登录中...' : '钉钉登录');
            }

            function getPublicPathPrefix() {
                var path = window.location.pathname || '/';
                var markers = ['/login', '/register', '/neo/', '/api/'];
                for (var i = 0; i < markers.length; i++) {
                    var idx = path.indexOf(markers[i]);
                    if (idx > 0) {
                        return path.slice(0, idx).replace(/\/+$/, '');
                    }
                }
                if (path === '/neo_hardware' || path.indexOf('/neo_hardware/') === 0) {
                    return '/neo_hardware';
                }
                return '';
            }

            function appPath(target) {
                var prefix = getPublicPathPrefix();
                var path = String(target || '/');
                if (!path.startsWith('/')) path = '/' + path;
                if (!prefix) return path;
                if (path === prefix || path.indexOf(prefix + '/') === 0) return path;
                return prefix + path;
            }

            function normalizeRedirectTarget(raw) {
                var prefix = getPublicPathPrefix();
                var fallback = appPath('/');
                var target = raw || fallback;
                try {
                    target = decodeURIComponent(target);
                } catch (e) {
                    target = raw || fallback;
                }
                if (!target || target === '/') return fallback;
                if (target.indexOf('http://') === 0 || target.indexOf('https://') === 0) {
                    try {
                        var url = new URL(target);
                        if (url.origin !== window.location.origin) return fallback;
                        return url.href;
                    } catch (e2) {
                        return fallback;
                    }
                }
                if (prefix && target.indexOf(prefix + '/') === 0) return target;
                if (target.charAt(0) === '/') return appPath(target);
                return fallback;
            }

            function redirectTarget() {
                var params = new URLSearchParams(window.location.search);
                return normalizeRedirectTarget(params.get('redirect') || '/');
            }

            function redirectAfterLogin() {
                setStatus('登录成功，正在进入系统...', 'success');
                window.location.replace(redirectTarget());
            }

            function isDingTalkEnvironment() {
                if (/dingtalk/i.test(window.navigator.userAgent || '')) return true;
                try {
                    return !!(window.dd && window.dd.env && window.dd.env.platform !== 'notInDingTalk');
                } catch (e) {
                    return false;
                }
            }

            function fetchJson(url, options) {
                return fetch(url, Object.assign({
                    credentials: 'include',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                }, options || {})).then(function(response) {
                    return response.json().catch(function() { return {}; }).then(function(payload) {
                        return { response: response, payload: payload };
                    });
                });
            }

            function loadDingTalkSdk() {
                if (window.dd) return Promise.resolve(window.dd);
                return new Promise(function(resolve, reject) {
                    var script = document.createElement('script');
                    script.src = appPath('/js/dingtalk.open.js');
                    script.async = true;
                    script.onload = function() {
                        if (window.dd) resolve(window.dd);
                        else reject(new Error('钉钉 JSAPI 加载失败'));
                    };
                    script.onerror = function() {
                        reject(new Error('无法加载钉钉 JSAPI'));
                    };
                    document.head.appendChild(script);
                });
            }

            function requestAuthCode(corpId) {
                return loadDingTalkSdk().then(function(dd) {
                    return new Promise(function(resolve, reject) {
                        function doRequest() {
                            var requestAuthCode = dd && dd.runtime && dd.runtime.permission && dd.runtime.permission.requestAuthCode;
                            if (typeof requestAuthCode !== 'function') {
                                reject(new Error('当前钉钉环境不支持免登授权'));
                                return;
                            }
                            requestAuthCode({
                                corpId: corpId,
                                onSuccess: function(result) {
                                    var code = result && (result.code || result.authCode);
                                    if (!code) {
                                        reject(new Error('钉钉未返回授权码'));
                                        return;
                                    }
                                    resolve(code);
                                },
                                onFail: function(error) {
                                    reject(new Error((error && (error.errorMessage || error.message)) || '钉钉授权失败'));
                                }
                            });
                        }
                        if (typeof dd.ready === 'function') {
                            var done = false;
                            dd.ready(function() {
                                if (done) return;
                                done = true;
                                doRequest();
                            });
                            if (typeof dd.error === 'function') {
                                dd.error(function(error) {
                                    if (done) return;
                                    done = true;
                                    reject(new Error((error && (error.errorMessage || error.message)) || '钉钉 JSAPI 初始化失败'));
                                });
                            }
                            window.setTimeout(function() {
                                if (done) return;
                                done = true;
                                doRequest();
                            }, 800);
                        } else {
                            doRequest();
                        }
                    });
                });
            }

            function startInAppLogin() {
                if (authInProgress) return Promise.resolve(false);
                if (!authConfig || !authConfig.inAppEnabled) {
                    setStatus('钉钉免登未启用，请联系管理员检查应用配置。', 'error');
                    return Promise.resolve(false);
                }
                setButtonBusy(true, '正在钉钉免登...');
                setStatus('正在向钉钉申请授权码...');
                return requestAuthCode(authConfig.corpId).then(function(code) {
                    return fetchJson(appPath('/api/auth/dingtalk/inapp-login'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                }).then(function(result) {
                    if (!result.response.ok || !(result.payload && result.payload.success)) {
                        throw new Error((result.payload && (result.payload.error || result.payload.msg)) || '钉钉免登失败');
                    }
                    redirectAfterLogin();
                    return true;
                }).catch(function(error) {
                    setStatus(error.message || '钉钉免登失败，请重试。', 'error');
                    return false;
                }).finally(function() {
                    setButtonBusy(false);
                });
            }

            function startWebLogin() {
                if (authInProgress) return;
                if (!authConfig || !authConfig.webLoginEnabled) {
                    setStatus('钉钉网页登录未启用，请联系管理员检查应用配置。', 'error');
                    return;
                }
                setButtonBusy(true, '正在跳转...');
                setStatus('正在生成钉钉登录地址...');
                var returnUrl = window.location.href;
                fetchJson(appPath('/api/auth/dingtalk/web/start?return_url=' + encodeURIComponent(returnUrl)), {
                    method: 'GET'
                }).then(function(result) {
                    var loginUrl = result.payload && result.payload.data && result.payload.data.loginUrl;
                    if (!result.response.ok || !loginUrl) {
                        throw new Error((result.payload && (result.payload.error || result.payload.msg)) || '未能生成钉钉登录地址');
                    }
                    window.location.href = loginUrl;
                }).catch(function(error) {
                    setStatus(error.message || '钉钉登录启动失败，请重试。', 'error');
                    setButtonBusy(false);
                });
            }

            function checkStartupStatus() {
                return fetchJson(appPath('/api/startup/status'), { method: 'GET' }).then(function(result) {
                    var payload = result.payload || {};
                    var startup = payload.startup || payload;
                    if (startup && startup.allowed === false) {
                        var overlay = document.getElementById('startupOverlay');
                        var bar = document.getElementById('startupBar');
                        var msg = document.getElementById('startupMessage');
                        overlay.classList.add('active');
                        bar.style.width = Math.max(0, Math.min(100, startup.progress || 0)) + '%';
                        msg.textContent = startup.message || '系统正在启动...';
                        return false;
                    }
                    document.getElementById('startupOverlay').classList.remove('active');
                    return true;
                }).catch(function() {
                    return true;
                });
            }

            function checkSession() {
                return fetchJson(appPath('/api/auth/session?lite=1'), { method: 'GET' }).then(function(result) {
                    var payload = result.payload || {};
                    if (result.response.ok && payload.authenticated) {
                        redirectAfterLogin();
                        return true;
                    }
                    return false;
                }).catch(function() {
                    return false;
                });
            }

            function loadAuthConfig() {
                return fetchJson(appPath('/api/auth/config'), { method: 'GET' }).then(function(result) {
                    if (!result.response.ok || !result.payload || !result.payload.data) {
                        throw new Error((result.payload && (result.payload.error || result.payload.msg)) || '无法读取钉钉登录配置');
                    }
                    authConfig = result.payload.data;
                    if (!authConfig.passwordLoginEnabled) {
                        loginHint.textContent = isDingTalkEnvironment()
                            ? '检测到钉钉环境，系统会自动尝试免登。'
                            : '当前仅支持钉钉授权登录。';
                    }
                    return authConfig;
                });
            }

            function boot() {
                loginBtn.addEventListener('click', function() {
                    if (isDingTalkEnvironment()) startInAppLogin();
                    else startWebLogin();
                });

                checkStartupStatus()
                    .then(function(allowed) {
                        if (!allowed) return false;
                        return checkSession();
                    })
                    .then(function(alreadyLoggedIn) {
                        if (alreadyLoggedIn) return;
                        return loadAuthConfig();
                    })
                    .then(function(config) {
                        if (!config) return;
                        if (isDingTalkEnvironment() && config.inAppEnabled) {
                            startInAppLogin();
                        } else {
                            setStatus('请点击按钮使用钉钉授权登录。');
                        }
                    })
                    .catch(function(error) {
                        setStatus(error.message || '登录初始化失败，请刷新后重试。', 'error');
                    });
            }

            boot();
        })();
    </script>
</body>
</html>
