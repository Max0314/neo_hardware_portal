# Nginx配置文件：htmlsystm系统 - 会话亲和性（Sticky Session）
# 安装位置：/etc/nginx/sites-available/htmlsystm
# 启用方法：sudo ln -s /etc/nginx/sites-available/htmlsystm /etc/nginx/sites-enabled/

# 上游服务器配置（Gunicorn后端）
upstream gunicorn_backend {
    # 基于session_id cookie进行哈希，实现会话亲和性
    # 同一session_id的请求会被路由到同一个worker进程
    # consistent: 使用一致性哈希，worker重启时影响最小
    hash $cookie_session_id consistent;
    
    # Gunicorn后端服务器（监听8000端口）
    server 127.0.0.1:8000;
    
    # 如果有多个Gunicorn实例，可以添加更多：
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    
    # 保持连接池，减少连接建立开销
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# HTTP服务器配置
server {
    listen 80;
    # 替换为您的服务器IP或域名
    # 例如：server_name 10.70.33.26;
    # 或：server_name your-domain.com;
    server_name _;  # 默认匹配所有域名
    
    # 客户端最大请求体大小（用于文件上传）
    client_max_body_size 100M;
    
    # 请求头大小限制（支持大量Cookie，兼容钉钉浏览器）
    large_client_header_buffers 4 16k;
    client_header_buffer_size 16k;
    
    # 访问日志
    access_log /var/log/nginx/htmlsystm_access.log;
    error_log /var/log/nginx/htmlsystm_error.log;
    
    # 代理到Gunicorn
    location / {
        proxy_pass http://gunicorn_backend;
        
        # 代理请求头（重要：确保Gunicorn能正确识别客户端信息）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;  # 钉钉浏览器兼容
        
        # HTTP/1.1 保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 超时设置（与Gunicorn的timeout保持一致）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 缓冲设置（优化性能）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_temp_file_write_size 8k;
        
        # 禁用代理缓存（确保实时数据）
        proxy_cache off;
        
        # 错误处理
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
    
    # 健康检查端点（可选）
    location /health {
        proxy_pass http://gunicorn_backend;
        access_log off;
    }
    
    # 静态文件直接由Nginx提供（可选，如果使用Nginx提供静态文件）
    # 注意：当前系统可能没有使用/static/路径，此配置仅供参考
    # location /static/ {
    #     alias /path/to/htmlsystm/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
}

