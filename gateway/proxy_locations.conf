# 由 nginx.conf 的 server 块 include（挂载为 /etc/nginx/proxy_locations.conf，勿放入 conf.d/）

client_max_body_size 80m;
client_header_buffer_size 8k;
large_client_header_buffers 4 16k;
client_header_timeout 12s;
limit_req zone=gw_limit burst=120 nodelay;

# 网关存活探测（不经过业务限流，供运维与 compose healthcheck）
location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
}

# favicon 走 htmlsystm 快速路径（wsgi 直读 neo-logo.svg）。
# 勿在 gateway 用 alias 读挂载文件：VirtualBox/共享文件夹下 nginx  worker 常 Permission denied → 403。
location = /favicon.ico {
    proxy_pass http://htmlsystm_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    access_log off;
}

location /ws {
    proxy_pass http://neo_backend_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

