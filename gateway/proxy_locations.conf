location / {
    proxy_pass http://htmlsystm_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /neo_hardware;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript;
    sub_filter 'href="/"' 'href="/neo_hardware/"';
    sub_filter "href='/'" "href='/neo_hardware/'";
    sub_filter 'href="/static/' 'href="/neo_hardware/static/';
    sub_filter 'href="/css/' 'href="/neo_hardware/css/';
    sub_filter 'href="/js/' 'href="/neo_hardware/js/';
    sub_filter 'src="/static/' 'src="/neo_hardware/static/';
    sub_filter 'src="/js/' 'src="/neo_hardware/js/';
    sub_filter 'src="/logo.png' 'src="/neo_hardware/logo.png';
    sub_filter 'src="/favicon.ico' 'src="/neo_hardware/favicon.ico';
    sub_filter 'action="/api/' 'action="/neo_hardware/api/';
    sub_filter 'action="/login' 'action="/neo_hardware/login';
    sub_filter "'/api/" "'/neo_hardware/api/";
    sub_filter '"/api/' '"/neo_hardware/api/';
    sub_filter '`/api/' '`/neo_hardware/api/';
    sub_filter "'/login" "'/neo_hardware/login";
    sub_filter '"/login' '"/neo_hardware/login';
    sub_filter '`/login' '`/neo_hardware/login';
    sub_filter "'/register" "'/neo_hardware/register";
    sub_filter '"/register' '"/neo_hardware/register';
    sub_filter "'/announcement" "'/neo_hardware/announcement";
    sub_filter '"/announcement' '"/neo_hardware/announcement';
    sub_filter '`/announcement' '`/neo_hardware/announcement';
    sub_filter "'/review-center" "'/neo_hardware/review-center";
    sub_filter '"/review-center' '"/neo_hardware/review-center';
    sub_filter "'/board-management" "'/neo_hardware/board-management";
    sub_filter '"/board-management' '"/neo_hardware/board-management';
    sub_filter "'/sub-board-management" "'/neo_hardware/sub-board-management";
    sub_filter '"/sub-board-management' '"/neo_hardware/sub-board-management';
    sub_filter "'/user-management" "'/neo_hardware/user-management";
    sub_filter '"/user-management' '"/neo_hardware/user-management';
    sub_filter "'/library-management" "'/neo_hardware/library-management";
    sub_filter '"/library-management' '"/neo_hardware/library-management';
    sub_filter "'/material" "'/neo_hardware/material";
    sub_filter '"/material' '"/neo_hardware/material';
    sub_filter "'/bom-" "'/neo_hardware/bom-";
    sub_filter '"/bom-' '"/neo_hardware/bom-';
    sub_filter "'/dingtalk-" "'/neo_hardware/dingtalk-";
    sub_filter '"/dingtalk-' '"/neo_hardware/dingtalk-';
    sub_filter "'/neo/" "'/neo_hardware/neo/";
    sub_filter '"/neo/' '"/neo_hardware/neo/';
    sub_filter "'/neo'" "'/neo_hardware/neo'";
    sub_filter '"/neo"' '"/neo_hardware/neo"';
    sub_filter "'/neo-bridge" "'/neo_hardware/neo-bridge";
    sub_filter '"/neo-bridge' '"/neo_hardware/neo-bridge';
    sub_filter "'/systm_tool" "'/neo_hardware/systm_tool";
    sub_filter '"/systm_tool' '"/neo_hardware/systm_tool';
    sub_filter "'/bom_tool" "'/neo_hardware/bom_tool";
    sub_filter '"/bom_tool' '"/neo_hardware/bom_tool';
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # htmlsystm 重启瞬间避免长时间挂起
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
}
