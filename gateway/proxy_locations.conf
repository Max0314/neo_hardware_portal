location ~ ^/api/(fs|ais|memory|custom-ai|conversations|recycle-bin|netlist|dashboard|leaderboard|admin|cache|settings|schematic-review)(/|$) {
    proxy_pass http://neo_backend_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location = /neo {
    return 301 /neo/;
}

location /neo/ {
    rewrite ^/neo/(.*)$ /$1 break;
    proxy_pass http://neo_web_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # NEO SPA + bom_tool：资源已自托管于 /neo/vendor，CSP 仅需 'self'
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss:" always;
}

location / {
    proxy_pass http://htmlsystm_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /neo_hardware_portal;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript;
    sub_filter 'href="/"' 'href="/neo_hardware_portal/"';
    sub_filter "href='/'" "href='/neo_hardware_portal/'";
    sub_filter 'href="/static/' 'href="/neo_hardware_portal/static/';
    sub_filter 'href="/css/' 'href="/neo_hardware_portal/css/';
    sub_filter 'href="/js/' 'href="/neo_hardware_portal/js/';
    sub_filter 'src="/static/' 'src="/neo_hardware_portal/static/';
    sub_filter 'src="/js/' 'src="/neo_hardware_portal/js/';
    sub_filter 'src="/logo.png' 'src="/neo_hardware_portal/logo.png';
    sub_filter 'src="/favicon.ico' 'src="/neo_hardware_portal/favicon.ico';
    sub_filter 'action="/api/' 'action="/neo_hardware_portal/api/';
    sub_filter 'action="/login' 'action="/neo_hardware_portal/login';
    sub_filter "'/api/" "'/neo_hardware_portal/api/";
    sub_filter '"/api/' '"/neo_hardware_portal/api/';
    sub_filter '`/api/' '`/neo_hardware_portal/api/';
    sub_filter "'/login" "'/neo_hardware_portal/login";
    sub_filter '"/login' '"/neo_hardware_portal/login';
    sub_filter '`/login' '`/neo_hardware_portal/login';
    sub_filter "'/register" "'/neo_hardware_portal/register";
    sub_filter '"/register' '"/neo_hardware_portal/register';
    sub_filter "'/announcement" "'/neo_hardware_portal/announcement";
    sub_filter '"/announcement' '"/neo_hardware_portal/announcement';
    sub_filter '`/announcement' '`/neo_hardware_portal/announcement';
    sub_filter "'/review-center" "'/neo_hardware_portal/review-center";
    sub_filter '"/review-center' '"/neo_hardware_portal/review-center';
    sub_filter "'/board-management" "'/neo_hardware_portal/board-management";
    sub_filter '"/board-management' '"/neo_hardware_portal/board-management';
    sub_filter "'/sub-board-management" "'/neo_hardware_portal/sub-board-management";
    sub_filter '"/sub-board-management' '"/neo_hardware_portal/sub-board-management';
    sub_filter "'/user-management" "'/neo_hardware_portal/user-management";
    sub_filter '"/user-management' '"/neo_hardware_portal/user-management';
    sub_filter "'/library-management" "'/neo_hardware_portal/library-management";
    sub_filter '"/library-management' '"/neo_hardware_portal/library-management';
    sub_filter "'/material" "'/neo_hardware_portal/material";
    sub_filter '"/material' '"/neo_hardware_portal/material';
    sub_filter "'/bom-" "'/neo_hardware_portal/bom-";
    sub_filter '"/bom-' '"/neo_hardware_portal/bom-';
    sub_filter "'/dingtalk-" "'/neo_hardware_portal/dingtalk-";
    sub_filter '"/dingtalk-' '"/neo_hardware_portal/dingtalk-';
    sub_filter "'/neo/" "'/neo_hardware_portal/neo/";
    sub_filter '"/neo/' '"/neo_hardware_portal/neo/';
    sub_filter "'/neo'" "'/neo_hardware_portal/neo'";
    sub_filter '"/neo"' '"/neo_hardware_portal/neo"';
    sub_filter "'/neo-bridge" "'/neo_hardware_portal/neo-bridge";
    sub_filter '"/neo-bridge' '"/neo_hardware_portal/neo-bridge';
    sub_filter "'/systm_tool" "'/neo_hardware_portal/systm_tool";
    sub_filter '"/systm_tool' '"/neo_hardware_portal/systm_tool';
    sub_filter "'/bom_tool" "'/neo_hardware_portal/bom_tool";
    sub_filter '"/bom_tool' '"/neo_hardware_portal/bom_tool';
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # htmlsystm 重启瞬间避免长时间挂起
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
}
