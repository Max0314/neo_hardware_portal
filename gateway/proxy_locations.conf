location ^~ /report-audit/ {
    proxy_pass http://172.17.0.1:8000/;
    proxy_http_version 1.1;
    client_max_body_size 120m;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /neo_hardware/report-audit;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript application/json;
    sub_filter 'href="/' 'href="/neo_hardware/report-audit/';
    sub_filter "href='/" "href='/neo_hardware/report-audit/";
    sub_filter 'src="/' 'src="/neo_hardware/report-audit/';
    sub_filter "src='/" "src='/neo_hardware/report-audit/";
    sub_filter 'action="/' 'action="/neo_hardware/report-audit/';
    sub_filter "action='/" "action='/neo_hardware/report-audit/";
    sub_filter 'fetch("/' 'fetch("/neo_hardware/report-audit/';
    sub_filter "fetch('/" "fetch('/neo_hardware/report-audit/";
    sub_filter '`/api/v1/' '`/neo_hardware/report-audit/api/v1/';
    sub_filter '"/api/v1/' '"/neo_hardware/report-audit/api/v1/';
    sub_filter "'/api/v1/" "'/neo_hardware/report-audit/api/v1/";
    sub_filter 'axios.get("/' 'axios.get("/neo_hardware/report-audit/';
    sub_filter 'axios.post("/' 'axios.post("/neo_hardware/report-audit/';
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

