location = /neo {
    return 301 /neo/;
}

location /neo/ {
    rewrite ^/neo/(.*)$ /$1 break;
    proxy_pass http://neo_web_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # NEO SPA + bom_tool：资源已自托管于 /neo/vendor，CSP 仅需 'self'
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss:" always;
}

