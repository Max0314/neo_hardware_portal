# 统一入口：TLS 在容器 443 终止，由 compose 映射到宿主机 GATEWAY_PUBLISH_PORT（默认 8000）
# / → htmlsystm；/neo/ → NEO；/ws 与 NEO API → backend

upstream htmlsystm_upstream {
    server htmlsystm:8000;
    keepalive 16;
}

upstream neo_web_upstream {
    server web:80;
    keepalive 8;
}

upstream neo_backend_upstream {
    server backend:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 放宽 burst，避免 SPA 首屏并发静态资源触发 503（浏览器表现为「站点繁忙」）
limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=50r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SAMEORIGIN：允许 /neo 内 bom_tool 等同源 iframe；htmlsystm 仍由后端单独发 DENY
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # CSP 由 htmlsystm 按页面下发（含 Font Awesome / Google Fonts）；/neo/ 见 proxy_locations.conf
    # 勿在此 server 块全局追加严格 CSP，否则会与管理系统首页 CDN 资源冲突

    include /etc/nginx/proxy_locations.conf;
}
