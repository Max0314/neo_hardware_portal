# 统一入口：明文 HTTP，只绑定宿主机回环端口 GATEWAY_PUBLISH_PORT。
# TLS 由平台 Nginx 在 443 终止后反代过来，本层不再重复加密。
# / → htmlsystm；/neo/ → NEO；/ws 与 NEO API → backend

upstream htmlsystm_upstream {
    server htmlsystm:8000;
    keepalive 16;
}

upstream neo_web_upstream {
    server web:80;
    keepalive 8;
}

upstream neo_backend_upstream {
    server backend:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 对外协议以平台 Nginx 传来的为准，本层的 $scheme 只作兜底。
# 本网关监听明文 80，直接用 $scheme 会把上游的 https 覆盖成 http，
# 应用据此拼出的 redirect_uri 等绝对地址就会是 http:// —— 钉钉 OAuth 会拒绝。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 放宽 burst，避免 SPA 首屏并发静态资源触发 503（浏览器表现为「站点繁忙」）
limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # 跨 Compose 服务使用 Docker DNS 动态解析；报告容器重建换 IP 后无需重启网关。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HSTS 由平台 Nginx 在 TLS 层下发。本层是明文 HTTP，若在此重复添加，
    # 浏览器看到的是同一个响应头两份，且本层无从判断外部是否真的走了 HTTPS。
    # SAMEORIGIN：允许 /neo 内 bom_tool 等同源 iframe；htmlsystm 仍由后端单独发 DENY
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # CSP 由 htmlsystm 按页面下发（含 Font Awesome / Google Fonts）；/neo/ 见 proxy_locations.conf
    # 勿在此 server 块全局追加严格 CSP，否则会与管理系统首页 CDN 资源冲突

    include /etc/nginx/proxy_locations.conf;
}
